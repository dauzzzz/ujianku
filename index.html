async function saveKoreksiUraian(e, hasilId) {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  await runWithBusyLock(`koreksi-${hasilId}`, async () => {
    try {
      const hasil = STATE.hasilList.find(h => h.id === hasilId);
      if (!hasil) return;
      await loadBankSoalByMapel(hasil.mapel_id);

      const fd = new FormData(e.target);
      const updatedDetails = JSON.parse(JSON.stringify(hasil.detail_jawaban || {}));
      const rawAnswers = {};

      STATE.soalList.forEach(q => {
        rawAnswers[q.id] = updatedDetails[q.id]?.jawaban ?? '';
        if (q.jenis_soal === 'URAIAN') {
          const val = fd.get(`skor_${q.id}`);
          if (val !== null && val !== '') {
            updatedDetails[q.id] = updatedDetails[q.id] || {};
            updatedDetails[q.id].skor_manual = Number(val);
          }
        }
      });

      const recalc = calculateExamResult(STATE.soalList, rawAnswers, updatedDetails);
      await dbUpdate('hasil_ujian', hasilId, recalc);
      STATE.koreksiHasilId = null;
      await loadRoleScopedData();
      notify(`Koreksi esai tersimpan! Nilai Akhir: ${recalc.skor_akhir}`, "success");
    } catch (err) {
      notify("Gagal menyimpan koreksi esai: " + err.message, "error");
    }
  }, btn);
}

function triggerHtmlPrint(fullHtmlDoc) {
  try {
    const win = window.open('', '_blank', 'width=960,height=780');
    if (win && win.document) {
      win.document.open();
      win.document.write(fullHtmlDoc);
      win.document.close();
      setTimeout(() => {
        try { win.focus(); win.print(); } catch (_) {}
      }, 350);
      return;
    }
  } catch (_) {}

  try {
    let iframe = document.getElementById('cbt-hidden-print-frame');
    if (iframe) iframe.remove();
    iframe = document.createElement('iframe');
    iframe.id = 'cbt-hidden-print-frame';
    iframe.style.position = 'fixed';
    iframe.style.right = '0';
    iframe.style.bottom = '0';
    iframe.style.width = '0';
    iframe.style.height = '0';
    iframe.style.border = '0';
    document.body.appendChild(iframe);
    const doc = iframe.contentWindow.document;
    doc.open();
    doc.write(fullHtmlDoc);
    doc.close();
    setTimeout(() => {
      try {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      } catch (_) {
        window.print();
      }
    }, 350);
  } catch (_) {
    window.print();
  }
}

  );
  const blob = new Blob([printableDoc], { type: 'text/html;charset=utf-8' });

function renderQuestionInput(q) {
  const jenis = (q.jenis_soal || 'PG').toUpperCase();
  const ans = STATE.answers[q.id];

  if (jenis === 'PG') {
    const keys = q._opsiKeys || Object.keys(q.opsi_jawaban || {}).filter(k => q.opsi_jawaban[k]);
    return keys.map((k, idx) => {
      const displayLabel = ['A','B','C','D','E'][idx] || k;
      const checked = ans === k;
      return `
        <div role="radio" aria-checked="${checked}" tabindex="0"
          onclick="CBT.setStudentAnswer('${q.id}', '${k}')"
          class="flex items-start gap-3 p-3.5 rounded-2xl border cursor-pointer transition select-none ${checked
            ? 'bg-blue-50 border-blue-600 ring-1 ring-blue-600'
            : 'bg-white border-slate-200 hover:bg-slate-50'}">
          <span class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-extrabold shrink-0 ${checked
            ? 'bg-blue-700 text-white'
            : 'bg-slate-100 text-slate-700 border border-slate-300'}">${displayLabel}</span>
          <span class="pt-0.5 text-slate-800 flex-1">${renderRichText(q.opsi_jawaban[k])}</span>
        </div>
      `;
    }).join('');
  }

  if (jenis === 'PGK') {
    const keys = q._opsiKeys || Object.keys(q.opsi_jawaban || {}).filter(k => q.opsi_jawaban[k]);
    const selected = Array.isArray(ans) ? ans : [];
    return `
      <p class="text-xs text-blue-700 font-semibold mb-2">Pilih lebih dari satu jawaban yang benar:</p>
      ${keys.map(k => {
        const checked = selected.includes(k);
        return `
          <label class="flex items-start gap-3 p-3.5 rounded-2xl border cursor-pointer transition select-none ${checked
              ? 'bg-blue-50 border-blue-600 ring-1 ring-blue-600'
              : 'bg-white border-slate-200 hover:bg-slate-50'}">
            <input type="checkbox" ${checked ? 'checked' : ''}
              onchange="CBT.toggleStudentPGK('${q.id}', '${k}')"
              class="mt-1 w-4 h-4 accent-blue-700 cursor-pointer shrink-0" />
            <span class="text-slate-800 flex-1">${renderRichText(q.opsi_jawaban[k])}</span>
          </label>
        `;
      }).join('')}
    `;
  }

  if (jenis === 'BS') {
    const list = (q.opsi_jawaban && Array.isArray(q.opsi_jawaban.pernyataan) && q.opsi_jawaban.pernyataan.length > 0)
      ? q.opsi_jawaban.pernyataan
      : ["Pernyataan sesuai soal di atas"];
    const cur = (typeof ans === 'object' && ans !== null) ? ans : {};
    return `
      <div class="overflow-x-auto border border-slate-200 rounded-2xl">
        <table class="w-full text-left border-collapse">
          <thead class="bg-slate-100 text-xs font-extrabold text-slate-700">
            <tr>
              <th class="p-3 border-b">Pernyataan</th>
              <th class="p-3 border-b text-center w-24">Benar</th>
              <th class="p-3 border-b text-center w-24">Salah</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-200">
            ${list.map((stmt, i) => `
              <tr class="hover:bg-slate-50">
                <td class="p-3 text-slate-800">${renderRichText(stmt)}</td>
                <td class="p-3 text-center">
                  <input type="radio" name="bs_${q.id}_${i}" ${cur[i] === 'B' ? 'checked' : ''}
                    onchange="CBT.setStudentSubAnswer('${q.id}', '${i}', 'B')" class="w-4 h-4 accent-blue-700 cursor-pointer" />
                </td>
                <td class="p-3 text-center">
                  <input type="radio" name="bs_${q.id}_${i}" ${cur[i] === 'S' ? 'checked' : ''}
                    onchange="CBT.setStudentSubAnswer('${q.id}', '${i}', 'S')" class="w-4 h-4 accent-blue-700 cursor-pointer" />
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  if (jenis === 'MJ') {
    const premis = (q.opsi_jawaban && q.opsi_jawaban.premis) || [];
    const target = (q.opsi_jawaban && q.opsi_jawaban.target) || [];
    const cur = (typeof ans === 'object' && ans !== null) ? ans : {};
    return `
      <div class="space-y-3">
        ${premis.map((p, i) => `
          <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-center p-3 rounded-2xl bg-slate-50 border border-slate-200">
            <div class="sm:col-span-6 font-medium text-slate-800">${renderRichText(p)}</div>
            <div class="sm:col-span-1 text-center text-slate-400 hidden sm:block">➔</div>
            <div class="sm:col-span-5">
              <select onchange="CBT.setStudentSubAnswer('${q.id}', '${i}', this.value)"
                class="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-white text-sm focus:ring-2 focus:ring-blue-600">
                <option value="">-- Pilih Pasangan --</option>
                ${target.map((t, tIdx) => `
                  <option value="${tIdx}" ${String(cur[i]) === String(tIdx) ? 'selected' : ''}>${esc(t)}</option>
                `).join('')}
              </select>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  if (jenis === 'ISIAN') {
    return `
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1.5">Ketik Jawaban Singkat Anda:</label>
        <input type="text" value="${esc(ans || '')}"
          oninput="CBT.onStudentTextInput('${q.id}', this.value)"
          placeholder="Tulis jawaban di sini..."
          class="w-full px-4 py-3 rounded-2xl border-2 border-slate-300 focus:border-blue-600 outline-none font-semibold" />
      </div>
    `;
  }

  return `
    <div>
      <label class="block text-xs font-bold text-slate-500 mb-1.5">Tuliskan Uraian Jawaban Anda:</label>
      <textarea rows="5"
        oninput="CBT.onStudentTextInput('${q.id}', this.value)"
        placeholder="Jelaskan jawaban Anda secara lengkap..."
        class="w-full p-4 rounded-2xl border-2 border-slate-300 focus:border-blue-600 outline-none">${esc(ans || '')}</textarea>
    </div>
  `;
}

function renderMonitoringSection(fixedRuangId = null) {
  const scopedJadwal = getScopedJadwalList();
  const rows = scopedJadwal.filter(j => {
    if (fixedRuangId && j.ruang_id !== fixedRuangId) return false;
    if (!fixedRuangId && STATE.selectedRuangFilter !== 'Semua' && j.ruang_id !== STATE.selectedRuangFilter) return false;
    return true;
  });

  const stats = {
    belum: rows.filter(r => r.status_ujian === 'Belum Mulai').length,
    sedang: rows.filter(r => r.status_ujian === 'Sedang Mengerjakan').length,
    terkunci: rows.filter(r => r.status_ujian === 'Terkunci').length,
    selesai: rows.filter(r => r.status_ujian === 'Selesai').length
  };

  return `
    <div class="space-y-4">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="glass-panel p-4 rounded-2xl"><div class="text-xs text-slate-500 font-semibold">Belum Login</div><div class="text-2xl font-extrabold text-slate-800 mt-1">${stats.belum}</div></div>
        <div class="glass-panel p-4 rounded-2xl border-blue-200"><div class="text-xs text-blue-600 font-semibold">Sedang Mengerjakan</div><div class="text-2xl font-extrabold text-blue-700 mt-1">${stats.sedang}</div></div>
        <div class="glass-panel p-4 rounded-2xl border-red-200"><div class="text-xs text-red-600 font-semibold">Terkunci (Anti-Cheat)</div><div class="text-2xl font-extrabold text-red-600 mt-1">${stats.terkunci}</div></div>
        <div class="glass-panel p-4 rounded-2xl border-emerald-200"><div class="text-xs text-emerald-600 font-semibold">Selesai Ujian</div><div class="text-2xl font-extrabold text-emerald-700 mt-1">${stats.selesai}</div></div>
      </div>

      <div class="glass-panel rounded-2xl shadow-sm overflow-hidden">
        <div class="p-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
          <div>
            <h3 class="font-extrabold text-slate-900">Status Peserta Ujian Live</h3>
            <p class="text-xs text-slate-500">Gunakan <strong>Reset Login</strong> untuk membuka kunci/menyegarkan sesi masuk tanpa menghapus jawaban, atau <strong>Reset Sesi</strong> untuk mengulang ujian dari awal.</p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            ${stats.terkunci > 0 ? `
              <button onclick="CBT.bulkResetLogin(${fixedRuangId ? `'${fixedRuangId}'` : 'null'})"
                class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-extrabold shadow-xs">
                🔓 Reset Login Terkunci (${stats.terkunci})
              </button>
            ` : ''}
            <button onclick="CBT.refreshData()" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-extrabold text-slate-700">↻ Refresh Data</button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 uppercase">
              <tr>
                <th class="p-3">Asal Sekolah</th>
                <th class="p-3">NISN / User</th>
                <th class="p-3">Nama Peserta</th>
                <th class="p-3">Kelas / Ruang</th>
                <th class="p-3">Paket Ujian</th>
                <th class="p-3">Status</th>
                <th class="p-3 text-right">Kontrol Proktor / Admin</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${rows.length === 0 ? `
                <tr><td colspan="7" class="p-6 text-center text-slate-400">Belum ada peserta terjadwal pada cakupan sekolah/ruang ini.</td></tr>
              ` : rows.map(j => {
                const s = STATE.siswaList.find(x => x.id === j.siswa_id) || {};
                const sek = getSekolahById(j.sekolah_id || s.sekolah_id);
                const r = STATE.ruang.find(x => x.id === j.ruang_id) || {};
                const m = STATE.mapelList.find(x => x.id === j.mapel_id) || {};
                const badge = j.status_ujian === 'Selesai' ? 'bg-emerald-100 text-emerald-800'
                  : j.status_ujian === 'Terkunci' ? 'bg-red-100 text-red-700'
                  : j.status_ujian === 'Sedang Mengerjakan' ? 'bg-blue-100 text-blue-800'
                  : 'bg-slate-100 text-slate-600';
                const isSelesai = j.status_ujian === 'Selesai';
                return `
                  <tr class="hover:bg-slate-50/80">
                    <td class="p-3"><span class="px-2 py-0.5 rounded-md bg-slate-100 font-bold text-[10px]">${esc(sek.nama_sekolah)}</span></td>
                    <td class="p-3 font-mono font-bold">${esc(s.username)}</td>
                    <td class="p-3 font-semibold text-slate-900">${esc(s.nama_lengkap)}</td>
                    <td class="p-3">Kls ${esc(s.kelas)} • ${esc(r.kode_ruang || '-')}</td>
                    <td class="p-3">${esc(m.nama_mapel)}</td>
                    <td class="p-3">
                      <span class="px-2.5 py-1 rounded-full font-bold ${badge}">${esc(j.status_ujian)}</span>
                      ${Number(j.pelanggaran) > 0 ? `<span class="ml-1 text-[10px] font-bold text-red-600">(${j.pelanggaran}x)</span>` : ''}
                    </td>
                    <td class="p-3 text-right space-x-1 whitespace-nowrap">
                      <button onclick="CBT.resetLogin('${j.id}')"
                        ${isSelesai ? 'disabled title="Peserta sudah menyelesaikan ujian"' : ''}
                        class="px-2.5 py-1.5 rounded-lg font-bold transition ${isSelesai
                          ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                          : (j.status_ujian === 'Terkunci'
                            ? 'bg-amber-500 hover:bg-amber-600 text-white ring-2 ring-amber-300'
                            : 'bg-sky-600 hover:bg-sky-700 text-white')}">
                        Reset Login
                      </button>
                      <button onclick="CBT.resetSesi('${j.id}', '${j.siswa_id}', '${j.mapel_id}')" class="px-2.5 py-1.5 rounded-lg bg-red-600 hover:bg-red-700 text-white font-bold">Reset Sesi</button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

              <label class="block text-[11px] font-bold text-slate-600 mb-1">Bobot Soal:</label>

            <div class="flex flex-wrap items-center justify-between gap-2">

              <span id="stimulus-status-label" class="text-[11px] text-amber-800">${activeStimObj ? `Terhubung: Stimulus #${activeStimObj.urutan}` : (currentFormStimId === '__NEW__' ? 'Membuat Stimulus Baru' : 'Opsional (kosongkan jika soal tanpa stimulus)')}</span>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <input name="stimulus_judul" value="${esc(activeStimObj?.judul || '')}" placeholder="Judul Stimulus / Wacana (Opsional)" class="px-3 py-2 rounded-lg border border-amber-300 bg-white font-semibold" />

            </div>
            <textarea name="stimulus_isi_wacana" rows="2" placeholder="Isi teks wacana / bacaan / tabel HTML stimulus..." class="w-full p-2.5 rounded-lg border border-amber-300 bg-white">${esc(activeStimObj?.isi_wacana || '')}</textarea>
            <div id="stimulus-preview-wrap" class="${activeStimObj?.gambar_url ? 'flex' : 'hidden'} items-center gap-3 bg-white p-2 rounded-lg border border-amber-200">
              <img src="${esc(activeStimObj?.gambar_url || '')}" alt="Preview Stimulus" onerror="this.style.display='none'" class="h-14 w-20 object-contain rounded border" />
              <span class="text-[11px] text-slate-600 truncate">URL Aktif: ${esc(activeStimObj?.gambar_url || '')}</span>
            </div>
          </div>

          <!-- Rich Text Editor (Quill.js) + KaTeX Formula Pecahan -->
          <div class="space-y-1.5">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <label class="font-bold text-slate-700">Teks Pertanyaan Soal (Format Teks, Rata Paragraf &amp; Rumus Pecahan KaTeX):</label>
              <div class="flex items-center gap-1.5">
                <button type="button" onclick="CBT.insertKatexFraction()"
                  class="px-2.5 py-1 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-800 border border-indigo-300 font-bold text-[11px]">
                  ½ Sisipkan Pecahan (KaTeX)
                </button>
              </div>
            </div>
            <div id="quill-toolbar-pertanyaan">
              <span class="ql-formats">
                <button class="ql-bold" title="Tebal (Bold)"></button>
                <button class="ql-italic" title="Miring (Italic)"></button>
                <button class="ql-underline" title="Garis Bawah (Underline)"></button>
              </span>
              <span class="ql-formats">
                <button class="ql-align" value="" title="Rata Kiri"></button>
                <button class="ql-align" value="center" title="Rata Tengah"></button>
                <button class="ql-align" value="right" title="Rata Kanan"></button>
                <button class="ql-align" value="justify" title="Rata Kanan-Kiri"></button>

              <span class="ql-formats">
                <button class="ql-list" value="ordered" title="Daftar Bernomor"></button>
                <button class="ql-list" value="bullet" title="Daftar Poin"></button>
                <button class="ql-formula" title="Sisipkan Rumus Matematika (KaTeX)"></button>
                <button class="ql-clean" title="Hapus Format"></button>
              </span>
            </div>
            <div id="quill-pertanyaan-editor"></div>
            <textarea name="pertanyaan" id="hidden-pertanyaan-html" class="hidden">${esc(editingSoal ? editingSoal.pertanyaan : '')}</textarea>

            <input name="opsi_b" value="${esc(isPgOrPgk ? (editingSoal?.opsi_jawaban?.B || '') : '')}" placeholder="Opsi B" class="px-3 py-1.5 rounded-lg border bg-white" />
            <input name="opsi_c" value="${esc(isPgOrPgk ? (editingSoal?.opsi_jawaban?.C || '') : '')}" placeholder="Opsi C" class="px-3 py-1.5 rounded-lg border bg-white" />
            <input name="opsi_d" value="${esc(isPgOrPgk ? (editingSoal?.opsi_jawaban?.D || '') : '')}" placeholder="Opsi D" class="px-3 py-1.5 rounded-lg border bg-white" />
            <input name="opsi_e" value="${esc(isPgOrPgk ? (editingSoal?.opsi_jawaban?.E || '') : '')}" placeholder="Opsi E (Opsional)" class="px-3 py-1.5 rounded-lg border bg-white" />
            <span id="hint-pg-pgk" class="text-[11px] text-blue-700 self-center">${activeJenis === 'PGK' ? 'Kunci PGK: dipisah koma (misal: A,C)' : 'Kunci PG: 1 huruf (misal: A)'}</span>
          </div>

          <div id="box-BS" class="soal-type-box ${activeJenis==='BS' ? '' : 'hidden'}">

          </div>

          <div id="box-MJ" class="soal-type-box ${activeJenis==='MJ' ? '' : 'hidden'} grid grid-cols-1 sm:grid-cols-2 gap-2">

            <textarea name="mj_target" rows="3" placeholder="Daftar Pasangan Kanan (1 per baris). Kunci format indeks: 0:0,1:1" class="p-2 rounded-lg border bg-white">${esc(activeJenis==='MJ' ? ((editingSoal?.opsi_jawaban?.target || []).join('\n')) : '')}</textarea>
          </div>

          <div id="box-ISIAN" class="soal-type-box ${activeJenis==='ISIAN' ? '' : 'hidden'} text-[11px] text-slate-600">

          </div>

              ${editingSoal ? 'Simpan Perubahan Soal' : 'Simpan Soal Baru'}
            </button>
          </div>
        </form>

        <div class="mt-4">
          ${(() => {
            if (!editingSoal) {
              return `
                <div class="p-4 rounded-xl border border-dashed border-slate-300 bg-slate-50/80 text-center text-xs text-slate-500">
                  Mode input <strong>Soal Nomor ${activeNomor}</strong> belum tersimpan. Isi form di atas lalu klik <strong>Simpan Soal Baru</strong>, atau pilih nomor soal yang sudah ada pada tombol nomor di atas.
                </div>
              `;
            }
            const q = editingSoal;
            const stim = q.stimulus_id ? STATE.stimulusList.find(st => st.id === q.stimulus_id) : null;
            const jns = (q.jenis_soal || 'PG').toUpperCase();
            let detailOpsiHtml = '';

            if (jns === 'PG' || jns === 'PGK') {
              const keys = Object.keys(q.opsi_jawaban || {}).filter(k => q.opsi_jawaban[k]);
              const kunciList = String(q.kunci_jawaban || '').split(',').map(x => x.trim().toUpperCase());
              detailOpsiHtml = `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 mt-2">
                  ${keys.map(k => {
                    const isTrue = kunciList.includes(k.toUpperCase());
                    return `<div class="px-2.5 py-1 rounded border text-[11px] flex items-start gap-1 ${isTrue ? 'bg-emerald-50 border-emerald-300 text-emerald-900 font-bold' : 'bg-slate-50 border-slate-200 text-slate-700'}">
                      <strong>${esc(k)}.</strong> <span class="flex-1">${renderRichText(q.opsi_jawaban[k])}</span> ${isTrue ? '<span>✓</span>' : ''}
                    </div>`;
                  }).join('')}
                </div>`;
            } else if (jns === 'BS') {
              const list = (q.opsi_jawaban?.pernyataan && q.opsi_jawaban.pernyataan.length > 0)
                ? q.opsi_jawaban.pernyataan
                : ["Pernyataan tunggal sesuai soal di atas"];
              const kunciList = String(q.kunci_jawaban || '').split(',').map(x => x.trim().toUpperCase());
              detailOpsiHtml = `
                <div class="mt-2 space-y-1">
                  ${list.map((st, idx) => `<div class="px-2.5 py-1 rounded bg-slate-50 border border-slate-200 text-[11px] flex justify-between gap-2">
                    <span>${idx + 1}. ${renderRichText(st)}</span>
                    <strong class="text-blue-700 shrink-0">${kunciList[idx] === 'B' ? 'Benar' : (kunciList[idx] === 'S' ? 'Salah' : esc(kunciList[idx] || '-'))}</strong>
                  </div>`).join('')}
                </div>`;
            } else if (jns === 'MJ') {
              const premis = q.opsi_jawaban?.premis || [];
              const target = q.opsi_jawaban?.target || [];
              detailOpsiHtml = `
                <div class="mt-2 grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-[11px]">
                  <div class="p-2 rounded bg-slate-50 border border-slate-200"><strong>Premis:</strong> ${premis.map((p, i) => `${i}:${esc(p)}`).join(' | ')}</div>
                  <div class="p-2 rounded bg-slate-50 border border-slate-200"><strong>Pasangan:</strong> ${target.map((tg, i) => `${i}:${esc(tg)}`).join(' | ')}</div>
                </div>`;
            } else if (jns === 'URAIAN' && q.opsi_jawaban?.pedoman) {
              detailOpsiHtml = `<div class="mt-2 px-2.5 py-1.5 rounded bg-amber-50 border border-amber-200 text-[11px] text-amber-950"><strong>Pedoman Penskoran:</strong> ${esc(q.opsi_jawaban.pedoman)}</div>`;
            }

            return `
              <div class="p-4 rounded-xl border border-blue-500 ring-1 ring-blue-300 bg-white space-y-2 text-xs shadow-xs">
                <div class="flex flex-wrap items-start justify-between gap-2">
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="px-2.5 py-0.5 rounded bg-blue-700 text-white font-bold">Pratinjau Soal No. ${q.nomor_urut}</span>
                    <span class="px-2 py-0.5 rounded bg-slate-100 font-bold">${q.jenis_soal}</span>
                    <span class="text-slate-500">Bobot: <strong>${q.bobot}</strong></span>
                    <span class="text-emerald-700 font-bold">Kunci: ${esc(q.kunci_jawaban)}</span>
                  </div>
                  <button type="button" onclick="CBT.deleteSoal('${q.id}')" class="px-2.5 py-1 rounded bg-red-50 hover:bg-red-100 text-red-700 font-bold shrink-0">Hapus Soal Ini</button>
                </div>

                ${stim ? `
                  <div class="p-3 rounded-lg bg-[#FFFDF7] border border-amber-300 space-y-1.5">
                    <div class="flex flex-wrap items-center justify-between gap-1 text-[11px]">
                      <strong class="text-amber-950">📄 Stimulus #${stim.urutan}: ${esc(stim.judul)}</strong>
                      ${stim.gambar_url ? `<span class="text-blue-700 truncate max-w-xs">URL: ${esc(stim.gambar_url)}</span>` : ''}
                    </div>
                    ${stim.gambar_url ? `<img src="${esc(stim.gambar_url)}" onerror="this.style.display='none'" alt="Gambar Stimulus" class="max-h-36 rounded border border-amber-200 bg-white p-1" />` : ''}
                    ${stim.isi_wacana ? `<div class="text-slate-700 text-[11px] leading-relaxed">${renderRichText(stim.isi_wacana)}</div>` : ''}
                  </div>
                ` : ''}

                <div class="text-slate-900 font-semibold">${renderRichText(q.pertanyaan)}</div>
                ${detailOpsiHtml}
              </div>
            `;
          })()}
        </div>
      </div>
    `;
  }

  if (t === 'jadwal') {
    return `
      <div class="glass-panel rounded-2xl p-5 shadow-sm space-y-4">
        <h2 class="text-base font-extrabold text-slate-900">Distribusi Jadwal Ujian ke Peserta</h2>
        <form onsubmit="CBT.generateJadwal(event)" class="flex flex-wrap gap-3 bg-slate-50 p-4 rounded-2xl border text-xs">
          <select name="sekolah_id" class="px-3 py-2 rounded-xl border bg-white font-bold">
            <option value="ALL">🌐 Semua Sekolah (${STATE.siswaList.length} Siswa)</option>
            ${STATE.sekolahList.map(sk => `<option value="${sk.id}" ${sk.id===STATE.activeSekolahId?'selected':''}>${esc(sk.nama_sekolah)}</option>`).join('')}
          </select>
          <select name="mapel_id" required class="px-3 py-2 rounded-xl border bg-white font-bold">
            ${STATE.mapelList.map(m => `<option value="${m.id}">${esc(m.nama_mapel)}</option>`).join('')}
          </select>
          <select name="kelas" class="px-3 py-2 rounded-xl border bg-white font-bold">
            <option value="Semua">Semua Kelas</option>
            ${[...new Set(STATE.siswaList.map(s => s.kelas))].map(k => `<option value="${k}">Kelas ${esc(k)}</option>`).join('')}
          </select>
          <button type="submit" class="px-5 py-2 rounded-xl bg-blue-700 hover:bg-blue-800 text-white font-bold">Terbitkan Jadwal Peserta</button>
        </form>
        <p class="text-xs text-slate-500">Total jadwal aktif terdaftar: <strong>${STATE.jadwalList.length}</strong> sesi peserta.</p>
      </div>
    `;
  }

  if (t === 'hasil') {
    const list = getFilteredHasil();
    const koreksiTarget = STATE.koreksiHasilId ? STATE.hasilList.find(h => h.id === STATE.koreksiHasilId) : null;

    const itemStats = STATE.soalList.map(q => {
      let dijawab = 0, benar = 0;
      list.forEach(h => {
        const d = (h.detail_jawaban || {})[q.id];
        if (d && d.status !== 'kosong') {
          dijawab++;
          if (d.status === 'benar') benar++;
        }
      });
      const tingkatKesukaran = dijawab > 0 ? Math.round((benar / dijawab) * 100) : 0;
      return { q, dijawab, benar, tingkatKesukaran };
    });

    return `
      <div class="space-y-4">
        <div class="glass-panel rounded-2xl p-5 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <h2 class="text-base font-extrabold text-slate-900">Rekap Nilai & Koreksi Soal Uraian</h2>
            <div class="flex flex-wrap gap-2">
              <select onchange="CBT.selectMapelHasil(this.value)" class="px-2.5 py-1.5 rounded-xl border text-xs bg-white font-bold">
                <option value="Semua">Semua Paket Ujian</option>
                ${STATE.mapelList.map(m => `<option value="${m.id}" ${STATE.selectedMapelId===m.id?'selected':''}>${esc(m.nama_mapel)}</option>`).join('')}
              </select>
              <button onclick="CBT.exportHasilExcel()" class="px-3 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-bold">⬇ Export Rekap Excel</button>
              <button onclick="CBT.printRekapF4()" class="px-3 py-1.5 rounded-xl bg-blue-700 text-white text-xs font-bold">🖨 Cetak Laporan F4</button>
            </div>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 border-b text-slate-600">
                <tr>
                  <th class="p-3">Sekolah</th>
                  <th class="p-3">Peserta</th>
                  <th class="p-3">Paket Ujian</th>
                  <th class="p-3">B / P / S / K</th>
                  <th class="p-3">Nilai Akhir (100)</th>
                  <th class="p-3">Status</th>
                  <th class="p-3 no-print">Aksi</th>
                </tr>
              </thead>
              <tbody class="divide-y">
                ${list.length === 0 ? `
                  <tr><td colspan="7" class="p-6 text-center text-slate-400">Belum ada hasil ujian pada filter terpilih.</td></tr>
                ` : list.map(h => {
                  const s = STATE.siswaList.find(x => x.id === h.siswa_id) || {};
                  const sek = getSekolahById(h.sekolah_id || s.sekolah_id);
                  const m = STATE.mapelList.find(x => x.id === h.mapel_id) || {};
                  return `
                    <tr>
                      <td class="p-3 font-bold text-[10px]">${esc(sek.nama_sekolah)}</td>
                      <td class="p-3 font-bold">${esc(s.nama_lengkap)} <span class="text-slate-400 font-normal">(Kls ${esc(s.kelas)})</span></td>
                      <td class="p-3">${esc(m.nama_mapel)}</td>
                      <td class="p-3 font-mono">${h.jumlah_benar} / ${h.jumlah_parsial} / ${h.jumlah_salah} / ${h.jumlah_kosong}</td>
                      <td class="p-3 font-extrabold text-sm text-blue-700">${h.skor_akhir}</td>
                      <td class="p-3"><span class="px-2 py-0.5 rounded font-bold ${h.status==='Selesai'?'bg-emerald-100 text-emerald-800':'bg-amber-100 text-amber-800'}">${esc(h.status)}</span></td>
                      <td class="p-3 no-print">
                        <button onclick="CBT.openKoreksi('${h.id}', '${h.mapel_id}')" class="px-2.5 py-1 rounded-lg bg-blue-100 text-blue-800 font-bold">Koreksi / Rincian</button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>

        ${itemStats.length > 0 ? `
          <div class="glass-panel rounded-2xl p-5 shadow-sm">
            <h3 class="text-sm font-extrabold text-slate-900 mb-3">Analisis Butir Soal (Paket Terpilih)</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 border-b"><tr><th class="p-2.5">No</th><th class="p-2.5">Tipe</th><th class="p-2.5">Pertanyaan</th><th class="p-2.5">Menjawab Benar</th><th class="p-2.5">Daya Serap</th></tr></thead>
                <tbody class="divide-y">
                  ${itemStats.map(it => `
                    <tr>
                      <td class="p-2.5 font-bold">${it.q.nomor_urut}</td>
                      <td class="p-2.5">${it.q.jenis_soal}</td>
                      <td class="p-2.5 max-w-md">${renderRichText(it.q.pertanyaan)}</td>
                      <td class="p-2.5">${it.benar} / ${it.dijawab} Peserta</td>
                      <td class="p-2.5 font-bold text-blue-700">${it.tingkatKesukaran}%</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        ` : ''}

        ${koreksiTarget ? `
          <div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 overflow-y-auto">
            <div class="bg-white rounded-3xl max-w-3xl w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">

                <h3 class="font-extrabold text-slate-900">Rincian Jawaban & Koreksi Esai</h3>

              <form onsubmit="CBT.saveKoreksi(event, '${koreksiTarget.id}')" class="space-y-3 text-xs">
                ${STATE.soalList.map(q => {
                  const det = (koreksiTarget.detail_jawaban || {})[q.id] || {};
                  return `
                    <div class="p-3.5 rounded-2xl border ${q.jenis_soal==='URAIAN'?'border-amber-300 bg-amber-50/40':'border-slate-200'}">
                      <div class="flex justify-between font-bold mb-1">
                        <span>No. ${q.nomor_urut} (${q.jenis_soal})</span>
                        <span>Skor: ${det.skor ?? 0} / ${q.bobot} (${esc(det.status || '-')})</span>
                      </div>
                      <div class="text-slate-700 mb-2">${renderRichText(q.pertanyaan)}</div>
                      <div class="bg-white p-2.5 rounded-xl border text-slate-800">
                        <strong>Jawaban Siswa:</strong> ${esc(typeof det.jawaban === 'object' ? JSON.stringify(det.jawaban) : (det.jawaban || '(Kosong)'))}
                      </div>
                      ${q.jenis_soal === 'URAIAN' ? `
                        <div class="mt-2 flex flex-wrap items-center justify-between gap-2 bg-amber-100/70 p-2.5 rounded-xl">
                          <span class="text-amber-950"><strong>Pedoman:</strong> ${esc(q.opsi_jawaban?.pedoman || q.kunci_jawaban)}</span>
                          <div class="flex items-center gap-1.5">
                            <label class="font-bold">Input Skor (0 - ${q.bobot}):</label>
                            <input type="number" step="0.5" min="0" max="${q.bobot}" name="skor_${q.id}" value="${det.skor_manual ?? det.skor ?? 0}"
                              class="w-20 px-2 py-1 rounded-lg border bg-white font-bold" />
                          </div>
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
                <div class="flex justify-end gap-2 pt-3 border-t">
                  <button type="button" onclick="CBT.closeKoreksi()" class="px-4 py-2 rounded-xl border font-bold">Tutup</button>
                  <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 text-white font-bold">Simpan Koreksi & Hitung Ulang Nilai</button>
                </div>
              </form>
            </div>
          </div>
        ` : ''}
      </div>
    `;
  }

  if (t === 'panduan') {
    return renderSqlAndDeployGuide();
  }

  return renderCetakKartuSection();
}

/* ============================================================================

function getFilteredCardStudents() {
  const scopedSiswa = getScopedSiswaList();
  const byKelas = STATE.selectedKelasFilter === 'Semua'
    ? scopedSiswa
    : scopedSiswa.filter(x => x.kelas === STATE.selectedKelasFilter);

  if (STATE.cardPrintMode === 'single' && STATE.cardSingleSiswaId) {
    return byKelas.filter(x => x.id === STATE.cardSingleSiswaId);
  }
  return byKelas;
}

function renderSingleOfficialCardHtml(siswa) {
  const sek = getSekolahById(siswa.sekolah_id);
  const brand = getAppBranding();
  const cardLogo = sek.logo_url || brand.logo_url || DEFAULT_SHIELD_SVG;
  const studentJadwalRows = STATE.jadwalList.filter(j => String(j.siswa_id) === String(siswa.id));
  const resolvedRuangId = siswa.ruang_id || studentJadwalRows.find(j => j.ruang_id)?.ruang_id || null;
  const resolvedSesiId = siswa.sesi_id || studentJadwalRows.find(j => j.sesi_id)?.sesi_id || null;

  const r = STATE.ruang.find(x => String(x.id) === String(resolvedRuangId));
  let se = STATE.sesi.find(x => String(x.id) === String(resolvedSesiId));
  if (!se) {
    const schoolSesiList = STATE.sesi.filter(x => String(x.sekolah_id) === String(siswa.sekolah_id));
    if (schoolSesiList.length === 1) se = schoolSesiList[0];

    ? `${r.kode_ruang} (${r.nama_ruang})`

    .map(j => STATE.mapelList.find(m => m.id === j.mapel_id))

          <td class="bio-colon">:</td>
          <td class="bio-value">${esc(siswa.username)}</td>
        </tr>
        <tr>
          <td class="bio-label">Kelas</td>
          <td class="bio-colon">:</td>
          <td class="bio-value">Kelas ${esc(siswa.kelas)}</td>
        </tr>
        <tr>
          <td class="bio-label">Ruang &amp; Sesi</td>
          <td class="bio-colon">:</td>
          <td class="bio-room">${esc(ruangLabel)} • ${esc(sesiJam)}</td>
        </tr>
      </table>

      <div class="cbt-card-cred">
        <span>Username: <strong style="font-family:monospace;">${esc(siswa.username)}</strong></span>
        <span>PIN: <strong style="color:#1D4ED8;font-family:monospace;">${esc(siswa.password)}</strong></span>
      </div>

      <table class="cbt-card-table">
        <thead>
          <tr>

              <td style="text-align:center;">07:30 - 09:30<br/>WIB</td>

/* ============================================================================
   SQL SCHEMA LENGKAP & PANDUAN KONFIGURASI SUPABASE / BLOGGER
   ============================================================================ */
function getFullSqlSchema() {
  return `CREATE EXTENSION IF NOT EXISTS "pgcrypto";

-- 1. MASTER PENGATURAN SEKOLAH & TOKEN PER SEKOLAH (Multi-Tenant Root)
CREATE TABLE IF NOT EXISTS public.pengaturan_sekolah (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    nama_sekolah TEXT NOT NULL DEFAULT 'SDN GEDONGBOYOUNTUNG',
    npsn TEXT UNIQUE NOT NULL DEFAULT '20506432',
    kecamatan TEXT DEFAULT 'Kecamatan Turi, Kabupaten Lamongan',
    logo_url TEXT DEFAULT '',
    app_badge TEXT DEFAULT 'PUSDATIN • ANBK',
    app_subtitle TEXT DEFAULT 'Sistem Asesmen Berbasis Komputer',
    token_aktif TEXT NOT NULL DEFAULT 'SAS2026',
    tanggal_ujian TEXT DEFAULT '2026-11-25',
    token_updated_at TIMESTAMPTZ DEFAULT NOW(),
    created_at TIMESTAMPTZ DEFAULT NOW()
);
ALTER TABLE public.pengaturan_sekolah ADD COLUMN IF NOT EXISTS app_badge TEXT DEFAULT 'PUSDATIN • ANBK';
ALTER TABLE public.pengaturan_sekolah ADD COLUMN IF NOT EXISTS app_subtitle TEXT DEFAULT 'Sistem Asesmen Berbasis Komputer';

-- 2. RUANG UJIAN (Terisolasi per sekolah_id)
CREATE TABLE IF NOT EXISTS public.ruang_ujian (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    sekolah_id UUID REFERENCES public.pengaturan_sekolah(id) ON DELETE CASCADE,
    kode_ruang TEXT NOT NULL,
    nama_ruang TEXT NOT NULL,
    kapasitas INTEGER NOT NULL DEFAULT 35,
    created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 3. SESI UJIAN (Terisolasi per sekolah_id)
CREATE TABLE IF NOT EXISTS public.sesi_ujian (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    sekolah_id UUID REFERENCES public.pengaturan_sekolah(id) ON DELETE CASCADE,
    nama_sesi TEXT NOT NULL,
    waktu_mulai TIME NOT NULL DEFAULT '07:30:00',
    waktu_selesai TIME NOT NULL DEFAULT '09:30:00',
    created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 4. PROKTOR / PENGAWAS RUANG (Wajib terikat ke sekolah_id)
CREATE TABLE IF NOT EXISTS public.proktor (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    sekolah_id UUID REFERENCES public.pengaturan_sekolah(id) ON DELETE CASCADE,
    username TEXT UNIQUE NOT NULL,
    password TEXT NOT NULL,
    nama_proktor TEXT NOT NULL,
    nip TEXT DEFAULT '-',
    ruang_id UUID REFERENCES public.ruang_ujian(id) ON DELETE SET NULL,
    created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 5. MAPEL / PAKET UJIAN
CREATE TABLE IF NOT EXISTS public.mapel (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    sekolah_id UUID REFERENCES public.pengaturan_sekolah(id) ON DELETE CASCADE,
    sekolah_ids JSONB NOT NULL DEFAULT '[]'::jsonb,
    kode_mapel TEXT UNIQUE NOT NULL,
    nama_mapel TEXT NOT NULL,
    kelas_target TEXT DEFAULT 'Semua',
    durasi_menit INTEGER NOT NULL DEFAULT 60,
    tanggal_mulai DATE DEFAULT CURRENT_DATE,
    jam_mulai TIME DEFAULT '07:00:00',
    jam_selesai TIME DEFAULT '15:00:00',
    acak_soal BOOLEAN NOT NULL DEFAULT true,
    acak_opsi BOOLEAN NOT NULL DEFAULT true,
    status TEXT NOT NULL DEFAULT 'Aktif' CHECK (status IN ('Aktif', 'Draft')),
    updated_at TIMESTAMPTZ DEFAULT NOW(),
    created_at TIMESTAMPTZ DEFAULT NOW()
);
ALTER TABLE public.mapel ADD COLUMN IF NOT EXISTS sekolah_ids JSONB NOT NULL DEFAULT '[]'::jsonb;
ALTER TABLE public.mapel ADD COLUMN IF NOT EXISTS updated_at TIMESTAMPTZ DEFAULT NOW();

-- 6. SISWA (Terisolasi ketat per sekolah_id)
CREATE TABLE IF NOT EXISTS public.siswa (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    sekolah_id UUID REFERENCES public.pengaturan_sekolah(id) ON DELETE CASCADE,
    username TEXT UNIQUE NOT NULL,
    password TEXT NOT NULL,
    nama_lengkap TEXT NOT NULL,
    kelas TEXT NOT NULL DEFAULT 'VI',
    jenis_kelamin TEXT NOT NULL DEFAULT 'Laki-Laki',
    tgl_lahir TEXT DEFAULT '',
    foto_url TEXT DEFAULT '',
    ruang_id UUID REFERENCES public.ruang_ujian(id) ON DELETE SET NULL,
    sesi_id UUID REFERENCES public.sesi_ujian(id) ON DELETE SET NULL,
    created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 7. JADWAL & STATUS PESERTA
CREATE TABLE IF NOT EXISTS public.jadwal_peserta (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    sekolah_id UUID REFERENCES public.pengaturan_sekolah(id) ON DELETE CASCADE,
    siswa_id UUID NOT NULL REFERENCES public.siswa(id) ON DELETE CASCADE,
    mapel_id UUID NOT NULL REFERENCES public.mapel(id) ON DELETE CASCADE,
    ruang_id UUID REFERENCES public.ruang_ujian(id) ON DELETE SET NULL,
    sesi_id UUID REFERENCES public.sesi_ujian(id) ON DELETE SET NULL,
    status_ujian TEXT NOT NULL DEFAULT 'Belum Mulai'
        CHECK (status_ujian IN ('Belum Mulai', 'Sedang Mengerjakan', 'Terkunci', 'Selesai')),
    pelanggaran INTEGER NOT NULL DEFAULT 0,
    created_at TIMESTAMPTZ DEFAULT NOW(),
    UNIQUE (siswa_id, mapel_id)
);

-- 8. STIMULUS / WACANA SOAL
CREATE TABLE IF NOT EXISTS public.stimulus (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    mapel_id UUID NOT NULL REFERENCES public.mapel(id) ON DELETE CASCADE,
    judul TEXT NOT NULL,
    isi_wacana TEXT DEFAULT '',
    gambar_url TEXT DEFAULT '',
    urutan INTEGER NOT NULL DEFAULT 1,
    created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 9. BANK SOAL (6 Tipe: PG, PGK, BS, MJ, ISIAN, URAIAN)
CREATE TABLE IF NOT EXISTS public.soal (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    mapel_id UUID NOT NULL REFERENCES public.mapel(id) ON DELETE CASCADE,
    stimulus_id UUID REFERENCES public.stimulus(id) ON DELETE SET NULL,
    nomor_urut INTEGER NOT NULL DEFAULT 1,
    jenis_soal TEXT NOT NULL DEFAULT 'PG'
        CHECK (jenis_soal IN ('PG', 'PGK', 'BS', 'MJ', 'ISIAN', 'URAIAN')),
    pertanyaan TEXT NOT NULL,
    opsi_jawaban JSONB NOT NULL DEFAULT '{}'::jsonb,
    kunci_jawaban TEXT NOT NULL DEFAULT '',
    bobot NUMERIC(6,2) NOT NULL DEFAULT 1,
    created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 10. HASIL UJIAN & REKAP NILAI
CREATE TABLE IF NOT EXISTS public.hasil_ujian (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    sekolah_id UUID REFERENCES public.pengaturan_sekolah(id) ON DELETE CASCADE,
    siswa_id UUID NOT NULL REFERENCES public.siswa(id) ON DELETE CASCADE,
    mapel_id UUID NOT NULL REFERENCES public.mapel(id) ON DELETE CASCADE,
    skor_akhir NUMERIC(6,2) NOT NULL DEFAULT 0,
    total_skor_mentah NUMERIC(8,2) NOT NULL DEFAULT 0,
    total_bobot_maks NUMERIC(8,2) NOT NULL DEFAULT 0,
    jumlah_benar INTEGER NOT NULL DEFAULT 0,
    jumlah_salah INTEGER NOT NULL DEFAULT 0,
    jumlah_parsial INTEGER NOT NULL DEFAULT 0,
    jumlah_kosong INTEGER NOT NULL DEFAULT 0,
    detail_jawaban JSONB NOT NULL DEFAULT '{}'::jsonb,
    status TEXT NOT NULL DEFAULT 'Selesai'
        CHECK (status IN ('Selesai', 'Menunggu Koreksi')),
    waktu_mulai TIMESTAMPTZ DEFAULT NOW(),
    waktu_selesai TIMESTAMPTZ DEFAULT NOW(),
    UNIQUE (siswa_id, mapel_id)
);

-- INDEX OPTIMALISASI 250-350+ PESERTA SERENTAK
CREATE INDEX IF NOT EXISTS idx_sekolah_npsn ON public.pengaturan_sekolah(npsn);
CREATE INDEX IF NOT EXISTS idx_proktor_sekolah ON public.proktor(sekolah_id);
CREATE INDEX IF NOT EXISTS idx_proktor_username ON public.proktor(username);
CREATE INDEX IF NOT EXISTS idx_siswa_sekolah ON public.siswa(sekolah_id);
CREATE INDEX IF NOT EXISTS idx_siswa_username ON public.siswa(username);
CREATE INDEX IF NOT EXISTS idx_jadwal_sekolah ON public.jadwal_peserta(sekolah_id);
CREATE INDEX IF NOT EXISTS idx_hasil_sekolah ON public.hasil_ujian(sekolah_id);

-- ROW LEVEL SECURITY (HYBRID ACCESS)
ALTER TABLE public.pengaturan_sekolah ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.ruang_ujian ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.sesi_ujian ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.proktor ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.mapel ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.siswa ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.jadwal_peserta ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.stimulus ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.soal ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.hasil_ujian ENABLE ROW LEVEL SECURITY;

DO $$
DECLARE tbl TEXT;
BEGIN
    FOR tbl IN SELECT unnest(ARRAY[
        'pengaturan_sekolah','ruang_ujian','sesi_ujian','proktor',
        'mapel','siswa','jadwal_peserta','stimulus','soal','hasil_ujian'
    ])
    LOOP
        EXECUTE format('DROP POLICY IF EXISTS "Hybrid Access %I" ON public.%I', tbl, tbl);
        EXECUTE format('CREATE POLICY "Hybrid Access %I" ON public.%I FOR ALL TO anon, authenticated USING (true) WITH CHECK (true)', tbl, tbl);
    END LOOP;
END $$;

GRANT USAGE ON SCHEMA public TO anon, authenticated;
GRANT ALL ON ALL TABLES IN SCHEMA public TO anon, authenticated;
GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO anon, authenticated;

INSERT INTO public.pengaturan_sekolah (nama_sekolah, npsn, token_aktif)
SELECT 'SDN GEDONGBOYOUNTUNG', '20506432', 'SAS2026'
WHERE NOT EXISTS (SELECT 1 FROM public.pengaturan_sekolah WHERE npsn = '20506432');

NOTIFY pgrst, 'reload schema';`;
}

function copySqlSchema() {
  const ta = document.getElementById('sql-schema-box');
  if (!ta) return;
  ta.select();
  ta.setSelectionRange(0, 99999);
  try {
    document.execCommand('copy');
    notify("Skrip SQL lengkap berhasil disalin ke clipboard!", "success");
  } catch (_) {
    notify("Silakan blok dan salin teks SQL secara manual.", "info");
  }
}

function initQuillPertanyaanEditor() {
  const container = document.getElementById('quill-pertanyaan-editor');
  const toolbar = document.getElementById('quill-toolbar-pertanyaan');
  const hiddenEl = document.getElementById('hidden-pertanyaan-html');
  if (!container || !toolbar || !window.Quill) {
    activeQuillPertanyaan = null;
    return;
  }
  activeQuillPertanyaan = new window.Quill(container, {
    theme: 'snow',
    placeholder: 'Ketik pertanyaan soal di sini (gunakan toolbar di atas untuk Bold, Italic, Underline, Rata Paragraf, atau Rumus Pecahan)...',
    modules: {
      toolbar: toolbar
    }
  });
  if (hiddenEl && hiddenEl.value) {
    activeQuillPertanyaan.clipboard.dangerouslyPasteHTML(hiddenEl.value);
  }
  activeQuillPertanyaan.on('text-change', () => {
    if (hiddenEl) hiddenEl.value = activeQuillPertanyaan.root.innerHTML;
  });
}

function insertKatexFraction() {
  if (!activeQuillPertanyaan) {
    return notify("Editor soal belum siap.", "error");
  }
  const range = activeQuillPertanyaan.getSelection(true);
  const index = range ? range.index : activeQuillPertanyaan.getLength();
  activeQuillPertanyaan.insertEmbed(index, 'formula', '\\frac{a}{b}', 'user');
  activeQuillPertanyaan.setSelection(index + 1, 0, 'silent');
  notify("Rumus pecahan \\frac{a}{b} disisipkan. Klik rumus di editor untuk mengubah pembilang/penyebut.", "info");
}

function render() {
  const root = document.getElementById('app');
  let html = '';

  if (!STATE.role) html = renderLoginScreen();
  else if (STATE.role === 'siswa') html = renderSiswaPortal();
  else if (STATE.role === 'proktor') html = renderProktorPortal();
  else if (STATE.role === 'admin') html = renderAdminPortal();

  html += renderMapelModal();
  html += renderConfirmModal();
  html += renderInfoModal();

  root.innerHTML = html;
  renderToastOnly();
  if (STATE.role === 'admin' && STATE.adminTab === 'bank_soal') {
    initQuillPertanyaanEditor();
  }
}

  deletePaketSoal: (encodedMapelId) => {
    const mapelId = decodeURIComponent(String(encodedMapelId || ''));
    const targetMapel = STATE.mapelList.find(m => String(m.id) === mapelId);
    if (!targetMapel) return notify("Paket ujian tidak ditemukan.", "error");
    const label = `${targetMapel.kode_mapel} - ${targetMapel.nama_mapel}`;
    askConfirm(
      "Hapus Paket Soal Ujian",
      `Apakah Anda yakin ingin menghapus paket ujian "${label}" beserta seluruh soal, stimulus, jadwal, dan hasil ujian terkait?`,
      async () => {
        await runWithBusyLock(`delete-paket-${mapelId}`, async () => {
          try {
            await dbDelete('mapel', mapelId);
            if (IS_PREVIEW) {
              MOCK_DB.soal = (MOCK_DB.soal || []).filter(q => String(q.mapel_id) !== mapelId);
              MOCK_DB.stimulus = (MOCK_DB.stimulus || []).filter(s => String(s.mapel_id) !== mapelId);
              MOCK_DB.jadwal_peserta = (MOCK_DB.jadwal_peserta || []).filter(j => String(j.mapel_id) !== mapelId);
              MOCK_DB.hasil_ujian = (MOCK_DB.hasil_ujian || []).filter(h => String(h.mapel_id) !== mapelId);
            }
            localStorage.removeItem(`cbt_pkg_${mapelId}`);
            STATE.mapelList = STATE.mapelList.filter(m => String(m.id) !== mapelId);
            STATE.selectedMapelId = STATE.mapelList[0]?.id || '';
            STATE.soalList = [];
            STATE.stimulusList = [];
            STATE.editSoalId = null;
            STATE.newSoalNomor = null;
            STATE.formStimulusId = undefined;
            await loadRoleScopedData();
            STATE.editSoalId = STATE.soalList[0]?.id || null;
            render();
            notify(`Paket soal ujian "${label}" berhasil dihapus.`, "success");
          } catch (err) {
            notify("Gagal menghapus paket soal ujian: " + err.message, "error");
          }
        });
      },
      "Ya, Hapus Paket",
      true
    );
  },
  selectMapelHasil: async (mapelId) => {
    STATE.selectedMapelId = mapelId;
    if (mapelId !== 'Semua') await loadBankSoalByMapel(mapelId);
    render();
  },
  onFormJenisSoalChange: (jenis) => {
    document.querySelectorAll('.soal-type-box').forEach(el => el.classList.add('hidden'));
    if (jenis === 'PG' || jenis === 'PGK') {
      document.getElementById('box-PG-PGK')?.classList.remove('hidden');
      const hint = document.getElementById('hint-pg-pgk');
      if (hint) hint.textContent = jenis === 'PG' ? 'Kunci PG: 1 huruf (misal: A)' : 'Kunci PGK: dipisah koma (misal: A,C)';
    } else {
      document.getElementById(`box-${jenis}`)?.classList.remove('hidden');
    }
  },
  addStimulus,
  saveSoal,
  addSoal: saveSoal,
  onNomorUrutChange: (val) => {
    const num = Number(val);
    if (!num || num < 1) return;
    const found = STATE.soalList.find(q => Number(q.nomor_urut) === num);
    if (found) {
      STATE.editSoalId = found.id;
      STATE.newSoalNomor = null;
      STATE.formStimulusId = undefined;
    } else {
      STATE.editSoalId = null;
      STATE.newSoalNomor = num;
      STATE.formStimulusId = undefined;
    }
    render();
  },
  onFormStimulusChange: (stimId) => {
    STATE.formStimulusId = stimId;
    const form = document.getElementById('form-bank-soal');
    if (!form) return;
    const stim = (stimId && stimId !== '__NEW__')
      ? STATE.stimulusList.find(st => st.id === stimId)
      : null;
    const judulEl = form.querySelector('[name="stimulus_judul"]');
    const urlEl = form.querySelector('[name="stimulus_gambar_url"]');
    const wacanaEl = form.querySelector('[name="stimulus_isi_wacana"]');
    const statusEl = document.getElementById('stimulus-status-label');
    if (judulEl) judulEl.value = stim?.judul || '';
    if (urlEl) urlEl.value = stim?.gambar_url || '';
    if (wacanaEl) wacanaEl.value = stim?.isi_wacana || '';
    if (statusEl) {
      statusEl.textContent = stim
        ? `Terhubung: Stimulus #${stim.urutan}`
        : (stimId === '__NEW__' ? 'Membuat Stimulus Baru' : 'Opsional (kosongkan jika soal tanpa stimulus)');
    }
    window.CBT.onStimulusUrlInput(stim?.gambar_url || '');
  },
  onStimulusUrlInput: (urlVal) => {
    const previewWrap = document.getElementById('stimulus-preview-wrap');
    if (!previewWrap) return;
    const trimmed = String(urlVal || '').trim();
    if (trimmed) {
      previewWrap.classList.remove('hidden');
      previewWrap.classList.add('flex');
      const img = previewWrap.querySelector('img');
      const span = previewWrap.querySelector('span');
      if (img) { img.style.display = ''; img.src = trimmed; }
      if (span) span.textContent = `URL Aktif: ${trimmed}`;
    } else {
      previewWrap.classList.add('hidden');
      previewWrap.classList.remove('flex');
    }
  },
  startEditSoal: (id) => {
    STATE.editSoalId = id;
    STATE.newSoalNomor = null;
    STATE.formStimulusId = undefined;
    render();
    document.getElementById('form-bank-soal')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  cancelEditSoal: () => {
    const nextNomor = STATE.soalList.reduce((max, q) => Math.max(max, Number(q.nomor_urut) || 0), 0) + 1;
    STATE.editSoalId = null;
    STATE.newSoalNomor = nextNomor;
    STATE.formStimulusId = undefined;
    render();
    document.getElementById('form-bank-soal')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  insertKatexFraction,
  downloadTemplateSoal,
  handleImportSoalExcel,
  exportSoalExcel,
  generateJadwal: generateJadwalMassal,
  openKoreksi: async (hasilId, mapelId) => {
    STATE.koreksiHasilId = hasilId;
    await loadBankSoalByMapel(mapelId);
    render();
  },
  closeKoreksi: () => { STATE.koreksiHasilId = null; render(); },
  saveKoreksi: saveKoreksiUraian,
  exportHasilExcel,
  setKelasFilter: (kls) => { STATE.selectedKelasFilter = kls; render(); },
  setCardPrintMode: (mode) => { STATE.cardPrintMode = mode; render(); },
  setCardSingleSiswa: (sid) => { STATE.cardSingleSiswaId = sid; render(); },
  setCardPaperSize: (sz) => { STATE.cardPaperSize = sz; render(); },
  toggleCardQR: (show) => { STATE.cardShowQR = show; render(); },
  printKartuF4,
  downloadKartuF4Html,
  printRekapF4,
  copySql: copySqlSchema,
  deleteItem: (table, id) => {
    const decodedId = decodeURIComponent(String(id || ''));
    if (!decodedId) return notify("ID data tidak valid.", "error");
    askConfirm("Konfirmasi Hapus Data", "Apakah Anda yakin ingin menghapus item ini?", async () => {
      await runWithBusyLock(`delete-${table}-${decodedId}`, async () => {
        try {
          await dbDelete(table, decodedId);
          if (table === 'proktor') {
            STATE.proktorList = STATE.proktorList.filter(x => String(x.id) !== decodedId);
          } else if (table === 'ruang_ujian') {
            STATE.ruang = STATE.ruang.filter(x => String(x.id) !== decodedId);
          } else if (table === 'sesi_ujian') {
            STATE.sesi = STATE.sesi.filter(x => String(x.id) !== decodedId);
          } else if (table === 'mapel') {
            if (IS_PREVIEW) {
              MOCK_DB.soal = (MOCK_DB.soal || []).filter(q => String(q.mapel_id) !== decodedId);
              MOCK_DB.stimulus = (MOCK_DB.stimulus || []).filter(s => String(s.mapel_id) !== decodedId);
              MOCK_DB.jadwal_peserta = (MOCK_DB.jadwal_peserta || []).filter(j => String(j.mapel_id) !== decodedId);
              MOCK_DB.hasil_ujian = (MOCK_DB.hasil_ujian || []).filter(h => String(h.mapel_id) !== decodedId);
            }
            STATE.mapelList = STATE.mapelList.filter(x => String(x.id) !== decodedId);
            localStorage.removeItem(`cbt_pkg_${decodedId}`);
            if (STATE.selectedMapelId === decodedId) {
              STATE.selectedMapelId = STATE.mapelList[0]?.id || '';
              STATE.soalList = [];
              STATE.stimulusList = [];
              STATE.editSoalId = null;
            }
          }
          await loadRoleScopedData();
          notify("Data berhasil dihapus.", "success");
        } catch (err) {
          notify("Gagal menghapus data: " + err.message, "error");
        }
      });
    });
  },
  deleteSoal: (id) => {
    askConfirm("Hapus Butir Soal", "Apakah Anda yakin ingin menghapus butir soal ini?", async () => {
      await runWithBusyLock(`delete-soal-${id}`, async () => {
        try {
          await dbDelete('soal', id);
          if (STATE.editSoalId === id) STATE.editSoalId = null;
          touchMapelCacheVersion(STATE.selectedMapelId);
          await loadBankSoalByMapel(STATE.selectedMapelId);
          STATE.editSoalId = STATE.soalList[0]?.id || null;
          STATE.newSoalNomor = null;
          STATE.formStimulusId = undefined;
          render();
          notify("Butir soal dihapus.", "success");
        } catch (err) {
          notify("Gagal menghapus soal: " + err.message, "error");
        }
      });
    });
  },
  closeConfirm: () => { if (isBusy('confirm-action')) return; STATE.confirmModal = null; render(); },
  runConfirm: async () => {
    const fn = STATE.confirmModal?.onConfirm;
    if (!fn || isBusy('confirm-action')) return;
    await runWithBusyLock('confirm-action', async () => {
      render();
      try {
        await fn();
      } finally {
        STATE.confirmModal = null;
        render();
      }
    });
  },
  closeInfo: () => { STATE.infoModal = null; render(); }
};

(async function init() {
  await loadInitialData();
  if (!IS_PREVIEW && sb) {
    const { data } = await sb.auth.getSession();
    if (data?.session?.user) {
      STATE.role = 'admin';
      STATE.user = { email: data.session.user.email, nama: 'Administrator Sekolah' };
      await loadRoleScopedData();
      setupTargetedRealtime();
      return;
    }
  }
  render();
})();
</script>
</body>
</html>
