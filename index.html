const CHUNK_SIZE = 100;
let activeQuillPertanyaan = null;

function isBusy(key) {
  return !!STATE.busyKeys[key];
}

async function runWithBusyLock(key, fn, triggerBtn = null) {
  if (STATE.busyKeys[key]) return;
  STATE.busyKeys[key] = true;
  let prevHtml = '';
  if (triggerBtn) {
    triggerBtn.disabled = true;
    prevHtml = triggerBtn.innerHTML;
    triggerBtn.innerHTML = 'Memproses...';
    triggerBtn.classList.add('opacity-70', 'cursor-wait');
  }
  try {
    return await fn();
  } finally {
    delete STATE.busyKeys[key];
    if (triggerBtn && document.body.contains(triggerBtn)) {
      triggerBtn.disabled = false;
      triggerBtn.innerHTML = prevHtml;
      triggerBtn.classList.remove('opacity-70', 'cursor-wait');
    }
  }
}

function chunkArray(items, size = CHUNK_SIZE) {
  const arr = Array.isArray(items) ? items : [items];
  const chunks = [];
  for (let i = 0; i < arr.length; i += size) {
    chunks.push(arr.slice(i, i + size));
  }
  return chunks;
}

function sleepMs(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function renderToastOnly() {
  const box = document.getElementById('cbt-toast-container');
  if (!box) return;
  if (!STATE.toast) {
    box.innerHTML = '';
    return;
  }
  const bg = STATE.toast.type === 'error'
    ? 'bg-red-600'
    : (STATE.toast.type === 'success' ? 'bg-emerald-600' : 'bg-slate-900');
  box.innerHTML = `
    <div class="${bg} text-white px-4 py-3 rounded-2xl shadow-xl text-xs font-bold max-w-sm pointer-events-auto">
      ${esc(STATE.toast.msg)}
    </div>
  `;
}

function notify(msg, type = 'info') {

}

function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function getWIBNow() {
  const now = new Date();
  const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
  return new Date(utc + (3600000 * 7));
}

function formatTime(sec) {
  const s = Math.max(0, Math.floor(sec));
  const h = String(Math.floor(s / 3600)).padStart(2, '0');
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const d = String(s % 60).padStart(2, '0');
  return `${h}:${m}:${d}`;
}

function formatTanggalIndo(dateStr) {
  if (!dateStr) return '-';
  const parts = String(dateStr).split('-');
  if (parts.length !== 3) return dateStr;
  const bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const idx = Number(parts[1]) - 1;
  return `${Number(parts[2])} ${bulan[idx] || parts[1]} ${parts[0]}`;
}

function formatTanggalSlash(dateStr) {
  if (!dateStr) return '-';
  const parts = String(dateStr).split('-');
  if (parts.length !== 3) return dateStr;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function formatSesiDisplay(se) {
  if (!se) return '';
  const mulaiRaw = String(se.waktu_mulai || '07:30').slice(0, 5);
  const selesaiRaw = String(se.waktu_selesai || '09:30').slice(0, 5);
  const hh = Number(mulaiRaw.split(':')[0]);
  const waktuLabel = Number.isFinite(hh)
    ? (hh < 11 ? 'Pagi' : (hh < 15 ? 'Siang' : 'Sore'))
    : '';
  let namaSesi = String(se.nama_sesi || 'Sesi').trim();
  if (waktuLabel && /\((pagi|siang|sore)\)/i.test(namaSesi)) {
    namaSesi = namaSesi.replace(/\((pagi|siang|sore)\)/i, `(${waktuLabel})`);
  }
  return `${namaSesi} (${mulaiRaw.replace(':', '.')} - ${selesaiRaw.replace(':', '.')} WIB)`;
}

function formatTanggalDMY(dateStr) {
  if (!dateStr) return '-';
  const clean = String(dateStr).trim().slice(0, 10);
  const parts = clean.split('-');
  if (parts.length !== 3) return dateStr;
  if (parts[0].length === 4) {
    return `${parts[2].padStart(2, '0')}-${parts[1].padStart(2, '0')}-${parts[0]}`;
  }
  return clean;
}

function parseDMYToISO(inputStr, fallbackISO = '2026-11-25') {
  if (!inputStr) return fallbackISO;
  const clean = String(inputStr).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(clean)) return clean;
  const match = clean.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/);
  if (!match) return null;
  const dd = Number(match[1]);
  const mm = Number(match[2]);
  const yyyy = Number(match[3]);
  if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return null;
  const dt = new Date(Date.UTC(yyyy, mm - 1, dd));
  if (dt.getUTCFullYear() !== yyyy || dt.getUTCMonth() !== mm - 1 || dt.getUTCDate() !== dd) return null;
  return `${String(yyyy).padStart(4, '0')}-${String(mm).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
}

function getMapelSchoolIds(mapel) {
  if (!mapel) return [];
  if (Array.isArray(mapel.sekolah_ids) && mapel.sekolah_ids.length > 0) {
    return [...new Set(mapel.sekolah_ids.map(String).filter(Boolean))];
  }
  if (typeof mapel.sekolah_ids === 'string' && mapel.sekolah_ids.trim().startsWith('[')) {
    try {
      const parsed = JSON.parse(mapel.sekolah_ids);
      if (Array.isArray(parsed) && parsed.length > 0) {
        return [...new Set(parsed.map(String).filter(Boolean))];
      }
    } catch (_) {}
  }
  if (mapel.sekolah_id) return [String(mapel.sekolah_id)];
  try {
    const localSaved = localStorage.getItem(`cbt_mapel_schools_${mapel.id}`);
    if (localSaved) {
      const parsedLocal = JSON.parse(localSaved);
      if (Array.isArray(parsedLocal) && parsedLocal.length > 0) {
        return [...new Set(parsedLocal.map(String).filter(Boolean))];
      }
    }
  } catch (_) {}
  return [];
}

function isMapelForSchool(mapel, schoolId) {
  if (!schoolId || schoolId === 'ALL') return true;
  const ids = getMapelSchoolIds(mapel);
  if (ids.length === 0) return true;
  return ids.includes(String(schoolId));
}

function renderRichText(rawHtml) {
  if (!rawHtml) return '';
  let html = String(rawHtml);
  if (window.katex) {
    html = html.replace(/\$\$([\s\S]+?)\$\$|\$([^$]+?)\$/g, (_, blockTex, inlineTex) => {
      const tex = (blockTex || inlineTex || '').trim();
      if (!tex) return '';
      try {
        return window.katex.renderToString(tex, {
          displayMode: Boolean(blockTex),
          throwOnError: false
        });
      } catch (_) {
        return esc(tex);
      }
    });
  }
  return `<div class="cbt-rich-content ql-editor">${html}</div>`;
}

function onLogoFileUpload(e, targetSchoolId) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    return notify("Pilih file gambar (PNG, JPG, WEBP, atau SVG) untuk logo.", "error");
  }
  if (file.size > 400 * 1024) {
    return notify("Ukuran file logo maksimal 400 KB agar penyimpanan ringan dan optimal.", "error");
  }
  const reader = new FileReader();
  reader.onload = (evt) => {
    const dataUrl = String(evt.target?.result || '');
    if (!dataUrl) return notify("Gagal membaca file logo.", "error");
    const formEl = document.getElementById(`form-sekolah-${targetSchoolId}`) || document.getElementById('form-app-branding');
    if (formEl) {
      const urlInput = formEl.querySelector('[name="logo_url"]');

    }
    window.CBT.onSchoolLogoInput(targetSchoolId, dataUrl);
    notify("Logo dari file berhasil dimuat. Klik tombol Simpan untuk menerapkan.", "success");
  };
  reader.readAsDataURL(file);
}

/* ============================================================================
   DATA ACCESS LAYER DENGAN ISOLASI SEKOLAH & BATCH CHUNKING (MAX 100 BARIS)
   ============================================================================ */
async function dbSelect(table, orderBy = null, schoolFilterId = null, columns = '*') {
  if (IS_PREVIEW) {
    let rows = JSON.parse(JSON.stringify(MOCK_DB[table] || []));
    if (schoolFilterId) {
      if (table === 'mapel') {
        rows = rows.filter(r => isMapelForSchool(r, schoolFilterId));
      } else {
        rows = rows.filter(r => r.sekolah_id === schoolFilterId);
      }
    }
    return rows;
  }

  let q = sb.from(table).select(columns);
  if (schoolFilterId && table !== 'mapel') {
    q = q.eq('sekolah_id', schoolFilterId);
  }
  if (orderBy) q = q.order(orderBy, { ascending: true });
  const { data, error } = await q;
  if (error) throw error;
  let rows = data || [];
  if (schoolFilterId && table === 'mapel') {
    rows = rows.filter(r => isMapelForSchool(r, schoolFilterId));
  }
  return rows;
}

async function dbInsert(table, payload) {
  const rows = Array.isArray(payload) ? payload : [payload];
  if (IS_PREVIEW) {
    const inserted = rows.map((r, i) => ({
      id: r.id || `${table}-${Date.now()}-${i}`,
      created_at: new Date().toISOString(),
      updated_at: new Date().toISOString(),
      ...r
    }));
    MOCK_DB[table] = [...(MOCK_DB[table] || []), ...inserted];
    return inserted;
  }
  const allInserted = [];
  for (const batch of chunkArray(rows, CHUNK_SIZE)) {
    const { data, error } = await sb.from(table).insert(batch).select();
    if (error) throw error;
    if (data) allInserted.push(...data);
  }
  return allInserted;
}

async function dbUpsert(table, payload, conflictCol) {
  const rows = Array.isArray(payload) ? payload : [payload];
  if (IS_PREVIEW) {
    rows.forEach(r => {
      const idx = (MOCK_DB[table] || []).findIndex(x =>
        conflictCol.split(',').every(c => x[c.trim()] === r[c.trim()])
      );
      if (idx >= 0) MOCK_DB[table][idx] = { ...MOCK_DB[table][idx], ...r, updated_at: new Date().toISOString() };
      else MOCK_DB[table].push({ id: `${table}-${Date.now()}-${Math.random()}`, updated_at: new Date().toISOString(), ...r });
    });
    return rows;
  }
  const allUpserted = [];
  for (const batch of chunkArray(rows, CHUNK_SIZE)) {
    const { data, error } = await sb.from(table).upsert(batch, { onConflict: conflictCol }).select();
    if (error) throw error;
    if (data) allUpserted.push(...data);
  }
  return allUpserted;
}

async function dbUpdate(table, id, payload, enforceSchoolId = null) {
  if (IS_PREVIEW) {
    const idx = (MOCK_DB[table] || []).findIndex(x => x.id === id && (!enforceSchoolId || x.sekolah_id === enforceSchoolId));
    if (idx >= 0) MOCK_DB[table][idx] = { ...MOCK_DB[table][idx], ...payload, updated_at: new Date().toISOString() };
    return;
  }
  let q = sb.from(table).update(payload).eq('id', id);
  if (enforceSchoolId) q = q.eq('sekolah_id', enforceSchoolId);
  const { error } = await q;
  if (error) throw error;
}

async function dbDelete(table, ids, enforceSchoolId = null) {
  const idList = (Array.isArray(ids) ? ids : [ids])
    .map(v => (v === null || v === undefined ? '' : String(v).trim()))
    .filter(Boolean);
  if (!idList.length) return [];
  if (IS_PREVIEW) {
    MOCK_DB[table] = (MOCK_DB[table] || []).filter(x =>
      !(idList.includes(String(x.id)) && (!enforceSchoolId || String(x.sekolah_id) === String(enforceSchoolId)))
    );
    return idList;
  }
  for (const batchIds of chunkArray(idList, CHUNK_SIZE)) {
    let q = sb.from(table).delete().in('id', batchIds);
    if (enforceSchoolId) q = q.eq('sekolah_id', enforceSchoolId);
    const { data, error } = await q.select('id');
    if (error) throw error;
    if (!data || data.length === 0) {
      throw new Error(`Data pada tabel '${table}' tidak terhapus (cek ID atau izin RLS/policy database).`);
    }
  }
  return idList;
}

    STATE.jadwalList = JSON.parse(JSON.stringify(MOCK_DB.jadwal_peserta || [])).filter(j => j.siswa_id === siswa.id);

async function loadBankSoalByMapel(mapelId) {

    STATE.stimulusList = MOCK_DB.stimulus.filter(s => s.mapel_id === mapelId).sort((a,b) => a.urutan - b.urutan);

/* ============================================================================
   3. TARGETED REALTIME & FALLBACK POLLING (30 DETIK)
   ============================================================================ */
function teardownRealtime() {
  if (STATE.realtimeChannel && sb) {
    try { sb.removeChannel(STATE.realtimeChannel); } catch (_) {}
  }
  STATE.realtimeChannel = null;
  STATE.realtimeConnected = false;

  if (STATE.fallbackPollInterval) {
    clearInterval(STATE.fallbackPollInterval);
    STATE.fallbackPollInterval = null;
  }
  if (STATE.periodicAutoSaveInterval) {
    clearInterval(STATE.periodicAutoSaveInterval);
    STATE.periodicAutoSaveInterval = null;
  }
}

function setupTargetedRealtime() {
  teardownRealtime();
  if (!STATE.role || !STATE.user) return;

  if (STATE.role === 'siswa') {
    const siswaId = STATE.user.id;

    if (!IS_PREVIEW && sb) {
      try {
        const ch = sb.channel(`cbt-student-${siswaId}`)
          .on('postgres_changes', {
            event: 'UPDATE',
            schema: 'public',
            table: 'siswa',
            filter: `id=eq.${siswaId}`
          }, (payload) => {
            if (payload.new) {
              STATE.user = { ...STATE.user, ...payload.new };
              render();
            }
          })
          .on('postgres_changes', {
            event: 'UPDATE',
            schema: 'public',
            table: 'jadwal_peserta',
            filter: `siswa_id=eq.${siswaId}`
          }, (payload) => {
            handleStudentJadwalRemoteUpdate(payload.new);
          })
          .on('postgres_changes', {
            event: 'UPDATE',
            schema: 'public',
            table: 'mapel'
          }, (payload) => {
            if (payload.new) {
              const idx = STATE.mapelList.findIndex(m => m.id === payload.new.id);
              if (idx >= 0) STATE.mapelList[idx] = { ...STATE.mapelList[idx], ...payload.new };
              render();
            }
          })
          .subscribe((status) => {
            STATE.realtimeConnected = (status === 'SUBSCRIBED');
          });
        STATE.realtimeChannel = ch;
      } catch (_) {
        STATE.realtimeConnected = false;
      }
    }

    STATE.fallbackPollInterval = setInterval(async () => {
      if (STATE.role !== 'siswa' || !STATE.user) return;
      try {
        if (IS_PREVIEW) {
          const latestJ = (MOCK_DB.jadwal_peserta || []).filter(j => j.siswa_id === siswaId);
          latestJ.forEach(handleStudentJadwalRemoteUpdate);
          return;
        }
        if (!sb) return;
        const activeMapelId = STATE.activeExamMapel?.id;
        const queries = [
          sb.from('jadwal_peserta').select('id,mapel_id,status_ujian,pelanggaran').eq('siswa_id', siswaId)
        ];
        if (activeMapelId) {
          queries.push(
            sb.from('mapel').select('id,status,tanggal_mulai,jam_mulai,jam_selesai').eq('id', activeMapelId).maybeSingle()
          );
        }
        const [jRes, mRes] = await Promise.all(queries);
        if (jRes?.data) jRes.data.forEach(handleStudentJadwalRemoteUpdate);
        if (mRes?.data) {
          const idx = STATE.mapelList.findIndex(m => m.id === mRes.data.id);
          if (idx >= 0) STATE.mapelList[idx] = { ...STATE.mapelList[idx], ...mRes.data };
        }
      } catch (_) {}
    }, 30000);
    return;
  }

  if (STATE.role === 'admin' || STATE.role === 'proktor') {
    const lockedSchoolId = STATE.role === 'proktor' ? STATE.user.sekolah_id : null;

    if (!IS_PREVIEW && sb) {
      try {
        const jadwalFilter = lockedSchoolId ? { filter: `sekolah_id=eq.${lockedSchoolId}` } : {};
        const hasilFilter = lockedSchoolId ? { filter: `sekolah_id=eq.${lockedSchoolId}` } : {};
        const ch = sb.channel(`cbt-monitor-${STATE.role}-${lockedSchoolId || 'all'}`)
          .on('postgres_changes', {
            event: '*',
            schema: 'public',
            table: 'jadwal_peserta',
            ...jadwalFilter
          }, (payload) => {
            if (payload.eventType === 'DELETE' && payload.old?.id) {
              STATE.jadwalList = STATE.jadwalList.filter(j => j.id !== payload.old.id);
            } else if (payload.new) {
              const idx = STATE.jadwalList.findIndex(j => j.id === payload.new.id);
              if (idx >= 0) STATE.jadwalList[idx] = { ...STATE.jadwalList[idx], ...payload.new };
              else STATE.jadwalList.push(payload.new);
            }
            if (STATE.adminTab === 'dashboard' || STATE.role === 'proktor') render();
          })
          .on('postgres_changes', {
            event: '*',
            schema: 'public',
            table: 'hasil_ujian',
            ...hasilFilter
          }, (payload) => {
            if (payload.eventType === 'DELETE' && payload.old?.id) {
              STATE.hasilList = STATE.hasilList.filter(h => h.id !== payload.old.id);
            } else if (payload.new) {
              const idx = STATE.hasilList.findIndex(h => h.id === payload.new.id);
              if (idx >= 0) STATE.hasilList[idx] = { ...STATE.hasilList[idx], ...payload.new };
              else STATE.hasilList.push(payload.new);
            }
            if (STATE.adminTab === 'hasil') render();
          })
          .subscribe((status) => {
            STATE.realtimeConnected = (status === 'SUBSCRIBED');
          });
        STATE.realtimeChannel = ch;
      } catch (_) {
        STATE.realtimeConnected = false;
      }
    }

    STATE.fallbackPollInterval = setInterval(async () => {
      if (!STATE.role || STATE.role === 'siswa') return;
      try {
        const cols = 'id,sekolah_id,siswa_id,mapel_id,ruang_id,sesi_id,status_ujian,pelanggaran';
        const latestJadwal = await dbSelect('jadwal_peserta', null, lockedSchoolId, cols);
        STATE.jadwalList = latestJadwal;
        if (STATE.adminTab === 'dashboard' || STATE.role === 'proktor') render();
      } catch (_) {}
    }, 30000);
  }
}

function handleStudentJadwalRemoteUpdate(updatedRow) {
  if (!updatedRow) return;
  const idx = STATE.jadwalList.findIndex(j => j.id === updatedRow.id || j.mapel_id === updatedRow.mapel_id);
  const prevStatus = idx >= 0 ? STATE.jadwalList[idx].status_ujian : null;

  if (idx >= 0) STATE.jadwalList[idx] = { ...STATE.jadwalList[idx], ...updatedRow };
  else STATE.jadwalList.push(updatedRow);

  if (prevStatus && prevStatus !== updatedRow.status_ujian) {
    if (updatedRow.status_ujian === 'Belum Mulai') {
      if (STATE.timerInterval) clearInterval(STATE.timerInterval);
      if (STATE.periodicAutoSaveInterval) clearInterval(STATE.periodicAutoSaveInterval);
      localStorage.removeItem(`cbt_draft_${STATE.user.id}_${updatedRow.mapel_id}`);
      STATE.answers = {};
      STATE.ragu = {};
      STATE.violationCount = 0;
      STATE.antiCheatModal = false;
      STATE.siswaStep = 'konfirmasi';
      notify("Sesi ujian Anda telah di-reset oleh Proktor. Silakan mulai ulang.", "info");
      render();
      return;
    }
    if (updatedRow.status_ujian === 'Sedang Mengerjakan' && prevStatus === 'Terkunci') {
      STATE.violationCount = 0;
      STATE.antiCheatModal = false;
      saveStudentDraftToLocal();
      notify("Reset login berhasil: Kunci akun Anda telah dibuka oleh Proktor.", "success");
    }
    render();
    return;
  }

  if (Number(updatedRow.pelanggaran) === 0 && STATE.violationCount > 0) {
    STATE.violationCount = 0;
    STATE.antiCheatModal = false;
    saveStudentDraftToLocal();
    notify("Status login Anda telah di-reset oleh Proktor.", "success");
    render();
  }
}

/* ============================================================================
   MESIN PENILAIAN OTOMATIS (6 TIPE SOAL + NORMALISASI SKALA 100)
   ============================================================================ */
function normalizeText(str) {
  return String(str || '')
    .trim()
    .toLowerCase()
    .replace(/(\d)\.(\d)/g, '$1__DOT__$2')
    .replace(/[,#!$%^&*;:{}=\-_`~()?"']/g, '')
    .replace(/\.(?!_)/g, '')
    .replace(/__DOT__/g, '.')
    .replace(/\s+/g, ' ')
    .trim();
}

function evaluateSingleQuestion(soal, ans, manualUraianScore = null) {
  const bobot = Number(soal.bobot) || 1;
  const jenis = (soal.jenis_soal || 'PG').toUpperCase();
  const kunci = String(soal.kunci_jawaban || '').trim();

  const isEmpty = ans === undefined || ans === null ||
    (typeof ans === 'string' && ans.trim() === '') ||
    (Array.isArray(ans) && ans.length === 0) ||
    (typeof ans === 'object' && !Array.isArray(ans) && Object.values(ans).every(v => v === '' || v === null || v === undefined));

  if (jenis === 'URAIAN') {
    if (manualUraianScore !== null && manualUraianScore !== undefined && manualUraianScore !== '') {
      const parsedSc = Number(manualUraianScore);
      const sc = Number.isFinite(parsedSc) ? Math.min(bobot, Math.max(0, parsedSc)) : 0;
      const status = sc >= bobot ? 'benar' : (sc > 0 ? 'parsial' : 'salah');
      return { skor: Number(sc.toFixed(2)), bobot, status, jawaban: ans || '' };
    }
    return {
      skor: 0,
      bobot,
      status: isEmpty ? 'kosong' : 'menunggu_koreksi',
      jawaban: ans || ''
    };
  }

  if (isEmpty) {
    return { skor: 0, bobot, status: 'kosong', jawaban: ans ?? '' };
  }

  if (jenis === 'PG') {
    const benar = String(ans).trim().toUpperCase() === kunci.toUpperCase();
    return { skor: benar ? bobot : 0, bobot, status: benar ? 'benar' : 'salah', jawaban: ans };
  }

  if (jenis === 'PGK') {
    const rawKeys = kunci.includes(',') || kunci.includes(';') || kunci.includes(' ')
      ? kunci.split(/[,;\s]+/)
      : kunci.split('');
    const keyArr = [...new Set(rawKeys.map(x => x.trim().toUpperCase()).filter(Boolean))];
    const ansArr = Array.isArray(ans) ? [...new Set(ans.map(x => String(x).trim().toUpperCase()).filter(Boolean))] : [];
    const activeOpsiKeys = Object.keys(soal.opsi_jawaban || {}).filter(k => String(soal.opsi_jawaban[k] ?? '').trim() !== '');
    const totalOpsi = activeOpsiKeys.length || 4;
    if (ansArr.length >= totalOpsi) {
      return { skor: 0, bobot, status: 'salah', jawaban: ansArr };
    }
    let B = 0, S = 0;
    ansArr.forEach(a => {
      if (keyArr.includes(a)) B++;
      else S++;
    });
    const K = keyArr.length || 1;
    const rasio = Math.max(0, (B - S) / K);
    const skor = Number((rasio * bobot).toFixed(2));
    const status = (B === K && S === 0) ? 'benar' : (skor > 0 ? 'parsial' : 'salah');
    return { skor, bobot, status, jawaban: ansArr };
  }

  if (jenis === 'BS') {
    const normalizeBS = (val) => {
      const v = String(val || '').trim().toUpperCase();
      if (v === 'B' || v === 'BENAR' || v === 'TRUE' || v === 'T') return 'B';
      if (v === 'S' || v === 'SALAH' || v === 'FALSE' || v === 'F') return 'S';
      return v;
    };
    const rawBsKeys = kunci.includes(',') || kunci.includes(' ')
      ? kunci.split(/[,\s]+/)
      : kunci.split('');
    const keyArr = rawBsKeys.map(normalizeBS).filter(Boolean);
    const pernyataan = (soal.opsi_jawaban && Array.isArray(soal.opsi_jawaban.pernyataan) && soal.opsi_jawaban.pernyataan.length > 0)
      ? soal.opsi_jawaban.pernyataan
      : ["Pernyataan sesuai soal di atas"];
    const N = pernyataan.length || keyArr.length || 1;
    let B = 0, answered = 0;
    for (let i = 0; i < N; i++) {
      if (ans[i] !== undefined && ans[i] !== '') {
        answered++;
        if (normalizeBS(ans[i]) === keyArr[i]) B++;
      }
    }
    if (answered === 0) return { skor: 0, bobot, status: 'kosong', jawaban: ans };
    const skor = Number(((B / N) * bobot).toFixed(2));
    const status = B === N ? 'benar' : (B > 0 ? 'parsial' : 'salah');
    return { skor, bobot, status, jawaban: ans };
  }

  if (jenis === 'MJ') {
    const pairs = kunci.split(/[,\s]+/).map(p => p.trim()).filter(Boolean);
    const N = pairs.length || 1;
    let B = 0, answered = 0;
    pairs.forEach(pair => {
      const parts = pair.split(/[:=-]/);
      const pIdx = String(parts[0] ?? '').trim();
      const tIdx = String(parts[1] ?? '').trim();
      if (pIdx === '' || tIdx === '') return;
      const userVal = ans[pIdx];
      if (userVal !== undefined && userVal !== null && String(userVal) !== '') {
        answered++;
        if (String(userVal).trim() === tIdx) B++;
      }
    });
    if (answered === 0) return { skor: 0, bobot, status: 'kosong', jawaban: ans };
    const skor = Number(((B / N) * bobot).toFixed(2));
    const status = B === N ? 'benar' : (B > 0 ? 'parsial' : 'salah');
    return { skor, bobot, status, jawaban: ans };
  }

  if (jenis === 'ISIAN') {
    const validKeys = kunci.split(/[|,]/).map(k => normalizeText(k)).filter(Boolean);
    const normAns = normalizeText(ans);
    const benar = validKeys.includes(normAns);
    return { skor: benar ? bobot : 0, bobot, status: benar ? 'benar' : 'salah', jawaban: ans };
  }

  return { skor: 0, bobot, status: 'salah', jawaban: ans };
}

function calculateExamResult(soalList, answersMap, existingDetails = {}) {
  let totalSkor = 0;
  let totalBobot = 0;
  let benar = 0, salah = 0, parsial = 0, kosong = 0;
  let hasPendingUraian = false;
  const details = {};

  soalList.forEach(q => {
    const prevManual = existingDetails[q.id] && existingDetails[q.id].skor_manual !== undefined
      ? existingDetails[q.id].skor_manual
      : null;
    const res = evaluateSingleQuestion(q, answersMap[q.id], prevManual);
    totalSkor += res.skor;
    totalBobot += res.bobot;

    if (res.status === 'benar') benar++;
    else if (res.status === 'parsial') parsial++;
    else if (res.status === 'kosong') kosong++;
    else if (res.status === 'menunggu_koreksi') {
      hasPendingUraian = true;
      kosong++;
    } else {
      salah++;
    }

    details[q.id] = {
      nomor_urut: q.nomor_urut,
      jenis_soal: q.jenis_soal,
      jawaban: res.jawaban,
      kunci: q.kunci_jawaban,
      skor: res.skor,
      bobot: res.bobot,
      status: res.status,
      ...(prevManual !== null ? { skor_manual: prevManual } : {})
    };
  });

  const skorAkhir = totalBobot > 0
    ? Number(((totalSkor / totalBobot) * 100).toFixed(2))
    : 0;

  return {
    skor_akhir: skorAkhir,
    total_skor_mentah: Number(totalSkor.toFixed(2)),
    total_bobot_maks: Number(totalBobot.toFixed(2)),
    jumlah_benar: benar,
    jumlah_salah: salah,
    jumlah_parsial: parsial,
    jumlah_kosong: kosong,
    detail_jawaban: details,
    status: hasPendingUraian ? 'Menunggu Koreksi' : 'Selesai'
  };
}

/* ============================================================================
   LOGIKA AUTENTIKASI 3 ROLE DENGAN ISOLASI SEKOLAH
   ============================================================================ */
async function handleLogin(e) {
  e.preventDefault();
  if (STATE.loginTab === 'siswa') {
    enterExamFullscreen();
  }
  const submitBtn = e.target.querySelector('button[type="submit"]');
  await runWithBusyLock('login', async () => {
    const fd = new FormData(e.target);
    const tab = STATE.loginTab;

    try {
      if (tab === 'admin') {
        const email = fd.get('email').trim();
        const password = fd.get('password').trim();
        if (IS_PREVIEW) {
          if (!email || !password) return notify("Masukkan email & password Admin.", "error");
          STATE.role = 'admin';
          STATE.user = { email, nama: 'Administrator Utama (alfian tech)' };
          await loadRoleScopedData();
          setupTargetedRealtime();
          return;
        }
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        STATE.role = 'admin';
        STATE.user = { email: data.user.email, nama: 'Administrator Sekolah' };
        await loadRoleScopedData();
        setupTargetedRealtime();
      }

      if (tab === 'proktor') {
        const username = fd.get('username').trim();
        const password = fd.get('password').trim();
        let proktor = null;
        if (IS_PREVIEW) {
          proktor = MOCK_DB.proktor.find(p => p.username === username && p.password === password);
        } else {
          const { data, error } = await sb.from('proktor')
            .select('*').eq('username', username).eq('password', password).maybeSingle();
          if (error) throw error;
          proktor = data;
        }
        if (!proktor) return notify("Username atau Password Proktor salah!", "error");
        if (!proktor.sekolah_id) {
          return notify("Akun Proktor ini belum ditautkan ke NPSN / Sekolah mana pun. Hubungi Admin.", "error");
        }

        STATE.role = 'proktor';
        STATE.user = proktor;
        STATE.activeSekolahId = proktor.sekolah_id;
        await loadRoleScopedData();
        setupTargetedRealtime();
      }

      if (tab === 'siswa') {
        const username = fd.get('username').trim();
        const password = fd.get('password').trim();
        const token = fd.get('token').trim().toUpperCase();

        await loadInitialData();

        let siswa = null;
        if (IS_PREVIEW) {
          siswa = MOCK_DB.siswa.find(s => s.username === username && s.password === password);
        } else {
          const { data, error } = await sb.from('siswa')
            .select('*').eq('username', username).eq('password', password).maybeSingle();
          if (error) throw error;
          siswa = data;
        }
        if (!siswa) return notify("NISN/Username atau Password Peserta tidak ditemukan!", "error");

        const studentSchool = getSekolahById(siswa.sekolah_id);
        const activeToken = (studentSchool?.token_aktif || '').toUpperCase();
        if (token !== activeToken) {
          return notify(`Token Ujian salah untuk ${studentSchool.nama_sekolah}! Periksa kembali token dari Proktor.`, "error");
        }

        await loadStudentScopedData(siswa);

        const locked = STATE.jadwalList.find(j => j.status_ujian === 'Terkunci');
        if (locked) {
          return notify("AKUN TERKUNCI! Anda terdeteksi keluar aplikasi/pindah tab. Hubungi Proktor sekolah Anda untuk Reset Login.", "error");
        }

        STATE.role = 'siswa';
        STATE.user = siswa;
        STATE.activeSekolahId = siswa.sekolah_id;
        STATE.siswaStep = 'konfirmasi';
        attachAntiCheatListeners();
        setupTargetedRealtime();
        render();
      }
    } catch (err) {
      notify("Gagal masuk: " + err.message, "error");
    }
  }, submitBtn);
}

/* ============================================================================
   ENGINE UJIAN SISWA (LOCALSTORAGE CACHING + JITTER + THROTTLED AUTO-SAVE)
   ============================================================================ */
function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

async function startStudentExam(mapelId) {
  enterExamFullscreen();
  await runWithBusyLock(`start-exam-${mapelId}`, async () => {
    const mapel = STATE.mapelList.find(m => m.id === mapelId);
    if (!mapel) return;
    if (mapel.status !== 'Aktif') {
      return notify("Paket ujian ini belum diaktifkan oleh Admin.", "error");
    }

    const wib = getWIBNow();
    const todayStr = wib.toISOString().slice(0, 10);
    const timeStr = wib.toTimeString().slice(0, 8);
    if (mapel.tanggal_mulai && todayStr < mapel.tanggal_mulai) {
      return notify(`Ujian dijadwalkan mulai tanggal ${formatTanggalDMY(mapel.tanggal_mulai)} WIB.`, "error");
    }
    if (mapel.jam_mulai && mapel.jam_selesai && todayStr === mapel.tanggal_mulai) {
      if (timeStr < mapel.jam_mulai || timeStr > mapel.jam_selesai) {
        return notify(`Waktu ujian aktif pukul ${mapel.jam_mulai} - ${mapel.jam_selesai} WIB.`, "error");
      }
    }

    STATE.loading = true;
    render();

    try {
      let latestMapelMeta = mapel;
      if (!IS_PREVIEW && sb) {
        try {
          const { data: metaRow } = await sb
            .from('mapel')
            .select('*')
            .eq('id', mapelId)
            .maybeSingle();
          if (metaRow) {
            if (metaRow.status && metaRow.status !== 'Aktif') {
              STATE.loading = false;
              render();
              return notify("Paket ujian baru saja dinonaktifkan oleh Admin.", "error");
            }
            latestMapelMeta = { ...mapel, ...metaRow };
          }
        } catch (_) {}
      }

      const serverStampStr = latestMapelMeta.updated_at || latestMapelMeta.created_at || '';
      const serverUpdatedMs = serverStampStr ? (Date.parse(serverStampStr) || 0) : 0;

      const pkgCacheKey = `cbt_pkg_${mapelId}`;
      let pkgData = null;
      try {
        const rawCache = localStorage.getItem(pkgCacheKey);
        if (rawCache) {
          const parsed = JSON.parse(rawCache);
          const cachedUpdatedMs = Number(parsed?.updated_at_ms) || 0;
          if (parsed && Array.isArray(parsed.soal) && parsed.soal.length > 0 && cachedUpdatedMs >= serverUpdatedMs) {
            pkgData = parsed;
          }
        }
      } catch (_) {}

      if (!pkgData) {
        const jitterMs = Math.floor(Math.random() * 3500);
        if (jitterMs > 0) await sleepMs(jitterMs);

        if (IS_PREVIEW) {
          pkgData = {
            updated_at_ms: Math.max(serverUpdatedMs, Date.now()),
            stimuli: MOCK_DB.stimulus.filter(s => s.mapel_id === mapelId),
            soal: MOCK_DB.soal.filter(q => q.mapel_id === mapelId).sort((a,b) => a.nomor_urut - b.nomor_urut)
          };
        } else {
          const [stRes, soRes] = await Promise.all([
            sb.from('stimulus').select('*').eq('mapel_id', mapelId).order('urutan', { ascending: true }),
            sb.from('soal').select('*').eq('mapel_id', mapelId).order('nomor_urut', { ascending: true })
          ]);
          if (stRes.error) throw stRes.error;
          if (soRes.error) throw soRes.error;
          pkgData = {
            updated_at_ms: Math.max(serverUpdatedMs, Date.now()),
            stimuli: stRes.data || [],
            soal: soRes.data || []
          };
        }
        try {
          localStorage.setItem(pkgCacheKey, JSON.stringify(pkgData));
        } catch (_) {}
      }

      if (!pkgData.soal || pkgData.soal.length === 0) {
        STATE.loading = false;
        render();
        return notify("Belum ada butir soal pada paket ujian ini.", "error");
      }

      const draftKey = `cbt_draft_${STATE.user.id}_${mapelId}`;
      let draft = null;
      try {
        const rawDraft = localStorage.getItem(draftKey);
        if (rawDraft) draft = JSON.parse(rawDraft);
      } catch (_) {}

      let orderedSoal = [...pkgData.soal];
      if (draft && Array.isArray(draft.soalOrder) && draft.soalOrder.length > 0) {
        const restored = draft.soalOrder.map(id => pkgData.soal.find(q => q.id === id)).filter(Boolean);
        if (restored.length > 0) orderedSoal = restored;
      } else if (mapel.acak_soal) {
        orderedSoal = shuffleArray(orderedSoal);
      }

      if (mapel.acak_opsi) {
        orderedSoal = orderedSoal.map(q => {
          if (q.jenis_soal === 'PG' || q.jenis_soal === 'PGK') {
            const keys = Object.keys(q.opsi_jawaban || {}).filter(k => String(q.opsi_jawaban[k] ?? '').trim() !== '');
            const order = (draft && draft.opsiOrder && draft.opsiOrder[q.id])
              ? draft.opsiOrder[q.id].filter(k => keys.includes(k))
              : shuffleArray(keys);
            return { ...q, _opsiKeys: order.length ? order : keys };
          }
          return q;
        });
      }

      const nowMs = Date.now();
      const durationMs = (Number(mapel.durasi_menit) || 60) * 60 * 1000;
      const endTimeMs = (draft && draft.endTimeMs) ? draft.endTimeMs : (nowMs + durationMs);
      const jadwal = STATE.jadwalList.find(j => j.mapel_id === mapelId);
      const serverViolations = Number(jadwal?.pelanggaran) || 0;

      STATE.activeExamMapel = mapel;
      STATE.examStimuli = pkgData.stimuli;
      STATE.examSoal = orderedSoal;
      STATE.currentIdx = 0;
      STATE.answers = (draft && draft.answers) ? draft.answers : {};
      STATE.ragu = (draft && draft.ragu) ? draft.ragu : {};
      STATE.violationCount = serverViolations === 0 ? 0 : ((draft && draft.violations) ? draft.violations : 0);
      STATE.timeLeftSec = Math.max(1, Math.floor((endTimeMs - nowMs) / 1000));
      STATE.lastSyncedSnapshotHash = JSON.stringify(STATE.answers);
      STATE.siswaStep = 'ujian';

      saveStudentDraftToLocal(endTimeMs);

      if (jadwal && jadwal.status_ujian === 'Belum Mulai') {
        await dbUpdate('jadwal_peserta', jadwal.id, { status_ujian: 'Sedang Mengerjakan' }, STATE.user.sekolah_id);
        jadwal.status_ujian = 'Sedang Mengerjakan';
      }

      startExamTimer(endTimeMs);
      startPeriodicAutoSave();
      attachAntiCheatListeners();
    } catch (err) {
      notify("Gagal memulai ujian: " + err.message, "error");
    } finally {
      STATE.loading = false;
      render();
    }
  });
}

function saveStudentDraftToLocal(customEndTimeMs = null) {
  if (!STATE.user || !STATE.activeExamMapel) return;
  const draftKey = `cbt_draft_${STATE.user.id}_${STATE.activeExamMapel.id}`;
  const prev = JSON.parse(localStorage.getItem(draftKey) || '{}');
  const opsiOrder = {};
  STATE.examSoal.forEach(q => { if (q._opsiKeys) opsiOrder[q.id] = q._opsiKeys; });

  localStorage.setItem(draftKey, JSON.stringify({
    soalOrder: STATE.examSoal.map(q => q.id),
    opsiOrder,
    answers: STATE.answers,
    ragu: STATE.ragu,
    violations: STATE.violationCount,
    startedAt: prev.startedAt || new Date().toISOString(),
    endTimeMs: customEndTimeMs || prev.endTimeMs || (Date.now() + STATE.timeLeftSec * 1000)
  }));
}

function onStudentTextAnswerInput(soalId, value) {
  STATE.answers[soalId] = value;
  if (STATE.textSaveDebounceTimer) clearTimeout(STATE.textSaveDebounceTimer);
  STATE.textSaveDebounceTimer = setTimeout(() => {
    saveStudentDraftToLocal();
  }, 500);
}

function startPeriodicAutoSave() {
  if (STATE.periodicAutoSaveInterval) clearInterval(STATE.periodicAutoSaveInterval);
  STATE.periodicAutoSaveInterval = setInterval(async () => {
    if (STATE.role !== 'siswa' || STATE.siswaStep !== 'ujian' || !STATE.activeExamMapel) return;
    saveStudentDraftToLocal();
    const currentHash = JSON.stringify(STATE.answers);
    if (currentHash === STATE.lastSyncedSnapshotHash) return;
    STATE.lastSyncedSnapshotHash = currentHash;

    try {
      const jadwal = STATE.jadwalList.find(j => j.mapel_id === STATE.activeExamMapel.id);
      if (jadwal && jadwal.status_ujian === 'Sedang Mengerjakan') {
        await dbUpdate('jadwal_peserta', jadwal.id, {
          status_ujian: 'Sedang Mengerjakan',
          pelanggaran: STATE.violationCount
        }, STATE.user.sekolah_id);
      }
    } catch (_) {}
  }, 45000);
}

function startExamTimer(endTimeMs) {
  if (STATE.timerInterval) clearInterval(STATE.timerInterval);
  STATE.timerInterval = setInterval(() => {
    const left = Math.floor((endTimeMs - Date.now()) / 1000);
    STATE.timeLeftSec = Math.max(0, left);
    const timerEl = document.getElementById('cbt-timer-display');
    if (timerEl) timerEl.textContent = formatTime(STATE.timeLeftSec);
    if (left <= 0) {
      clearInterval(STATE.timerInterval);
      executeSubmitExam(true);
    }
  }, 1000);
}

/* ============================================================================
   FITUR LAYAR PENUH (FULLSCREEN), ZOOM GAMBAR STIMULUS & PROTEKSI ESC/WINDOWS
   ============================================================================ */
async function enterExamFullscreen() {
  try {
    const el = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (el.requestFullscreen) await el.requestFullscreen();
      else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) await el.msRequestFullscreen();
    }
    if (navigator.keyboard && typeof navigator.keyboard.lock === 'function') {
      await navigator.keyboard.lock(['Escape']).catch(() => {});
    }
  } catch (_) {
    // Abaikan jika browser/perangkat membatasi Fullscreen API
  }
}

function exitExamFullscreen() {
  try {
    if (navigator.keyboard && typeof navigator.keyboard.unlock === 'function') {
      navigator.keyboard.unlock();
    }
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
  } catch (_) {}
}

function openStimulusZoom(src, caption = 'Gambar Stimulus') {
  if (!src) return;
  const existing = document.getElementById('cbt-stimulus-zoom-modal');
  if (existing) existing.remove();

  let scale = 1;
  const modal = document.createElement('div');
  modal.id = 'cbt-stimulus-zoom-modal';
  modal.className = 'no-print fixed inset-0 z-[9999999] bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center p-3 sm:p-5 select-none';
  modal.innerHTML = `
    <div class="w-full max-w-5xl flex flex-wrap items-center justify-between gap-2 text-white mb-3">
      <span class="text-xs sm:text-sm font-bold bg-slate-800/90 px-3 py-1.5 rounded-xl border border-slate-700 truncate max-w-full">
        🔍 ${esc(caption)}
      </span>
      <div class="flex items-center gap-1.5">
        <button type="button" id="cbt-zoom-out" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold border border-slate-600">− Perkecil</button>
        <button type="button" id="cbt-zoom-reset" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold border border-slate-600">100%</button>
        <button type="button" id="cbt-zoom-in" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold border border-slate-600">+ Perbesar</button>
        <button type="button" id="cbt-zoom-close" class="px-3.5 py-1.5 rounded-xl bg-red-600 hover:bg-red-700 text-xs font-extrabold shadow">✕ Tutup</button>
      </div>
    </div>
    <div id="cbt-zoom-stage" class="w-full max-w-5xl max-h-[82vh] overflow-auto flex items-center justify-center rounded-2xl bg-white/5 p-3">
      <img id="cbt-zoom-img" src="${esc(src)}" alt="Perbesar Stimulus"
        class="max-w-full max-h-[78vh] object-contain rounded-xl shadow-2xl bg-white p-1.5 transition-transform duration-150"
        style="transform: scale(1); transform-origin: center center;" />
    </div>
  `;
  document.body.appendChild(modal);

  const imgEl = modal.querySelector('#cbt-zoom-img');
  const applyScale = () => { imgEl.style.transform = `scale(${scale})`; };
  modal.querySelector('#cbt-zoom-in').onclick = (ev) => { ev.stopPropagation(); scale = Math.min(3, +(scale + 0.25).toFixed(2)); applyScale(); };
  modal.querySelector('#cbt-zoom-out').onclick = (ev) => { ev.stopPropagation(); scale = Math.max(0.75, +(scale - 0.25).toFixed(2)); applyScale(); };
  modal.querySelector('#cbt-zoom-reset').onclick = (ev) => { ev.stopPropagation(); scale = 1; applyScale(); };
  modal.querySelector('#cbt-zoom-close').onclick = () => modal.remove();
  modal.onclick = (ev) => {
    if (ev.target === modal || ev.target.id === 'cbt-zoom-stage') modal.remove();
  };
}

let lastSecurityTriggerAt = 0;
async function triggerStudentSecurityViolation(reasonText, isFullscreenExit = false) {
  if (STATE.role !== 'siswa') return;
  const now = Date.now();
  if (now - lastSecurityTriggerAt < 1200) return;
  lastSecurityTriggerAt = now;

  // Tutup modal zoom jika sedang terbuka agar peringatan langsung terlihat
  const zoomModal = document.getElementById('cbt-stimulus-zoom-modal');
  if (zoomModal) zoomModal.remove();

  // Jika siswa masih di halaman konfirmasi (belum masuk soal), cukup beri peringatan tanpa mengunci akun
  if (STATE.siswaStep !== 'ujian' || !STATE.activeExamMapel) {
    if (!isFullscreenExit) {
      showInfoModal(
        "Peringatan Keamanan Layar Ujian",
        `${reasonText} Tetap berada di mode Layar Penuh agar sesi ujian Anda tidak terganggu.`
      );
    } else {
      notify("Mode layar penuh dinonaktifkan. Klik tombol Mulai Ujian untuk kembali ke layar penuh.", "info");
    }
    return;
  }

  STATE.violationCount += 1;
  STATE.antiCheatReason = reasonText;
  saveStudentDraftToLocal();
  STATE.antiCheatModal = true;

  if (STATE.violationCount >= 3) {
    const jadwal = STATE.jadwalList.find(j => j.mapel_id === STATE.activeExamMapel.id);
    if (jadwal) {
      await dbUpdate('jadwal_peserta', jadwal.id, {
        status_ujian: 'Terkunci',
        pelanggaran: STATE.violationCount
      }, STATE.user.sekolah_id);
    }
    clearInterval(STATE.timerInterval);
    if (STATE.periodicAutoSaveInterval) clearInterval(STATE.periodicAutoSaveInterval);
    const lockedSchool = getSekolahById(STATE.user.sekolah_id);
    await handleLogout();
    showInfoModal(
      "AKUN UJIAN TERKUNCI (3x Pelanggaran)",
      `Sistem mengunci sesi ujian Anda karena terdeteksi melanggar aturan keamanan layar sebanyak 3 kali (${reasonText}). Silakan hubungi Proktor ${lockedSchool.nama_sekolah} untuk membuka kunci (Reset Login).`
    );
    return;
  }
  render();
}

let antiCheatAttached = false;
function attachAntiCheatListeners() {
  if (antiCheatAttached) return;
  antiCheatAttached = true;

  // 1. Deteksi pindah tab / minimize browser
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && STATE.role === 'siswa' && STATE.siswaStep === 'ujian' && STATE.activeExamMapel) {
      triggerStudentSecurityViolation('Anda terdeteksi berpindah tab atau meninggalkan layar ujian.');
    }
  });

  // 2. Batasi & beri peringatan saat tombol ESC atau Logo Windows (Meta/OS) ditekan
  window.addEventListener('keydown', (e) => {
    if (STATE.role !== 'siswa') return;
    const isEsc = e.key === 'Escape' || e.key === 'Esc' || e.keyCode === 27;
    const isWinKey = e.key === 'Meta' || e.key === 'OS' || e.keyCode === 91 || e.keyCode === 92;
    if (isEsc || isWinKey) {
      e.preventDefault();
      e.stopPropagation();
      const namaTombol = isEsc ? 'ESC' : 'Logo Windows';
      triggerStudentSecurityViolation(`Anda dilarang menekan tombol [${namaTombol}] selama sesi ujian berlangsung!`);
      enterExamFullscreen();
    }
  }, true);

  // 3. Tangkap pelepasan tombol Logo Windows (sering dicegat OS saat keydown)
  window.addEventListener('keyup', (e) => {
    if (STATE.role !== 'siswa') return;
    const isWinKey = e.key === 'Meta' || e.key === 'OS' || e.keyCode === 91 || e.keyCode === 92;
    if (isWinKey) {
      e.preventDefault();
      e.stopPropagation();
      triggerStudentSecurityViolation('Anda dilarang menggunakan tombol [Logo Windows] selama sesi ujian berlangsung!');
      enterExamFullscreen();
    }
  }, true);

  // 4. Deteksi jika siswa keluar dari mode Layar Penuh (misal karena ESC sistem)
  document.addEventListener('fullscreenchange', () => {
    if (STATE.role === 'siswa' && !document.fullscreenElement) {
      triggerStudentSecurityViolation('Anda keluar dari mode Layar Penuh (Fullscreen). Dilarang menekan ESC atau keluar dari layar penuh selama ujian!', true);
    }
  });

  // 5. Otomatis aktifkan klik-perbesar untuk semua gambar di dalam stimulus/soal ujian siswa
  document.addEventListener('click', (e) => {
    if (STATE.role !== 'siswa' || STATE.siswaStep !== 'ujian') return;
    const img = e.target.closest('img');
    if (!img) return;
    if (img.closest('#cbt-stimulus-zoom-modal') || img.closest('header') || img.closest('nav')) return;
    if (img.closest('#student-exam-view')) {
      openStimulusZoom(img.src, img.alt || 'Perbesar Gambar Stimulus');
    }
  });
}

function setStudentAnswer(soalId, value) {
  STATE.answers[soalId] = value;
  saveStudentDraftToLocal();
  render();
}

function toggleStudentPGK(soalId, optKey) {
  const cur = Array.isArray(STATE.answers[soalId]) ? [...STATE.answers[soalId]] : [];
  const idx = cur.indexOf(optKey);
  if (idx >= 0) cur.splice(idx, 1);
  else cur.push(optKey);
  STATE.answers[soalId] = cur;
  saveStudentDraftToLocal();
  render();
}

function setStudentSubAnswer(soalId, subKey, val) {
  const cur = (typeof STATE.answers[soalId] === 'object' && STATE.answers[soalId] !== null && !Array.isArray(STATE.answers[soalId]))
    ? { ...STATE.answers[soalId] }
    : {};
  if (val === '' || val === null || val === undefined) {
    delete cur[subKey];
  } else {
    cur[subKey] = val;
  }
  STATE.answers[soalId] = cur;
  saveStudentDraftToLocal();
  render();
}

function toggleStudentRagu(soalId) {
  if (STATE.ragu[soalId]) delete STATE.ragu[soalId];
  else STATE.ragu[soalId] = true;
  saveStudentDraftToLocal();
  render();
}

function promptSubmitStudentExam() {
  const raguCount = Object.keys(STATE.ragu).length;
  const msg = raguCount > 0
    ? `Masih ada ${raguCount} soal ditandai RAGU-RAGU. Apakah Anda yakin ingin mengakhiri ujian dan mengirim seluruh jawaban sekarang?`
    : "Apakah Anda yakin ingin mengakhiri ujian dan mengirim seluruh jawaban? Jawaban tidak dapat diubah setelah dikirim.";
  askConfirm("Konfirmasi Selesai Ujian", msg, () => executeSubmitExam(false), "Ya, Kirim Jawaban", false);
}

async function executeSubmitExam(isAutoTimeout = false) {
  await runWithBusyLock('submit-exam', async () => {
    if (STATE.timerInterval) clearInterval(STATE.timerInterval);
    if (STATE.periodicAutoSaveInterval) clearInterval(STATE.periodicAutoSaveInterval);
    if (STATE.textSaveDebounceTimer) clearTimeout(STATE.textSaveDebounceTimer);
    saveStudentDraftToLocal();
    STATE.loading = true;
    render();

    try {
      const mapelId = STATE.activeExamMapel.id;
      const draftKey = `cbt_draft_${STATE.user.id}_${mapelId}`;
      const draft = JSON.parse(localStorage.getItem(draftKey) || '{}');
      const calc = calculateExamResult(STATE.examSoal, STATE.answers);

      const payload = {
        sekolah_id: STATE.user.sekolah_id,
        siswa_id: STATE.user.id,
        mapel_id: mapelId,
        skor_akhir: calc.skor_akhir,
        total_skor_mentah: calc.total_skor_mentah,
        total_bobot_maks: calc.total_bobot_maks,

/* ============================================================================
   HELPER PARSER EXCEL & NORMALISASI HEADER KOLOM
   ============================================================================ */
async function ensureXlsxLoaded() {
  if (typeof window.XLSX !== 'undefined') return true;
  const fallbackUrls = [
    'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
  ];
  for (const url of fallbackUrls) {
    try {
      await new Promise((resolve, reject) => {
        const sc = document.createElement('script');
        sc.src = url;
        sc.onload = resolve;
        sc.onerror = reject;
        document.head.appendChild(sc);
      });
      if (typeof window.XLSX !== 'undefined') return true;
    } catch (_) {}
  }
  return typeof window.XLSX !== 'undefined';
}

function parseExcelWorkbook(arrayBuffer) {
  if (typeof window.XLSX === 'undefined') {
    throw new Error("Library Excel (SheetJS) belum termuat. Periksa koneksi internet lalu muat ulang halaman.");
  }
  const data = new Uint8Array(arrayBuffer);
  const wb = window.XLSX.read(data, { type: 'array' });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  if (!sheet) return [];

  const matrix = window.XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
  const knownHeaders = [
    'NPSN', 'KODE_NPSN', 'NPSN_SEKOLAH', 'NO_NPSN', 'NAMA_SEKOLAH', 'SEKOLAH', 'NAMA_SATUAN_PENDIDIKAN',
    'USERNAME_NISN', 'NISN_USERNAME', 'USERNAME', 'NISN', 'NO_PESERTA', 'NAMA_LENGKAP', 'NAMA_SISWA',
    'NAMA_PROKTOR', 'NAMA_GURU', 'KODE_RUANG', 'NAMA_RUANG', 'NAMA_SESI', 'WAKTU_MULAI', 'PERTANYAAN', 'SOAL'
  ];

  let headerRowIdx = 0;
  for (let i = 0; i < Math.min(matrix.length, 10); i++) {
    const normCells = (matrix[i] || []).map(c =>
      String(c ?? '').trim().toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_|_$/g, '')
    );
    if (normCells.some(cell => knownHeaders.includes(cell))) {
      headerRowIdx = i;
      break;
    }
  }

  const rawRows = window.XLSX.utils.sheet_to_json(sheet, { range: headerRowIdx, defval: '' });
  return rawRows.map(row => {
    const clean = {};
    Object.keys(row).forEach(k => {
      const normKey = String(k).trim().toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_|_$/g, '');
      clean[normKey] = row[k];
    });
    return clean;
  });
}

function pickCol(row, aliases, fallback = '') {
  for (const key of aliases) {
    if (row[key] !== undefined && row[key] !== null && String(row[key]).trim() !== '') {
      return String(row[key]).trim();
    }
  }
  return fallback;
}

function normalizeExcelTime(rawVal, fallback = '07:30:00') {
  if (rawVal === undefined || rawVal === null || String(rawVal).trim() === '') return fallback;
  if (typeof rawVal === 'number' && Number.isFinite(rawVal)) {
    const frac = rawVal >= 1 ? (rawVal % 1) : rawVal;
    const totalMinutes = Math.round(frac * 24 * 60);
    const hh = String(Math.floor(totalMinutes / 60) % 24).padStart(2, '0');
    const mm = String(totalMinutes % 60).padStart(2, '0');
    return `${hh}:${mm}:00`;
  }
  const cleaned = String(rawVal).trim().replace(/\./g, ':');
  const match = cleaned.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (match) {
    const hh = String(Math.min(23, Number(match[1]))).padStart(2, '0');
    const mm = String(Math.min(59, Number(match[2]))).padStart(2, '0');
    const ss = match[3] ? String(Math.min(59, Number(match[3]))).padStart(2, '0') : '00';
    return `${hh}:${mm}:${ss}`;
  }
  return fallback;
}

function handleImportSiswaExcel(e) {
  const inputEl = e.target;
  const file = inputEl?.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onerror = () => {
    inputEl.value = '';
    notify("Gagal membaca file Excel siswa.", "error");
  };
  reader.onload = async (evt) => {
    inputEl.value = '';
    await runWithBusyLock('import-siswa-excel', async () => {
      try {
        await ensureXlsxLoaded();
        const rows = parseExcelWorkbook(evt.target.result);
        if (!rows.length) return notify("File Excel kosong atau tidak terbaca.", "error");

        const defaultSchoolId = (STATE.activeSekolahId && STATE.activeSekolahId !== 'ALL')
          ? STATE.activeSekolahId
          : STATE.sekolahList[0]?.id;

        const dedupMap = new Map();
        rows.forEach(r => {
          const rowNpsn = pickCol(r, ['NPSN', 'KODE_NPSN', 'NPSN_SEKOLAH']).replace(/\.0$/, '');
          const targetSchool = rowNpsn
            ? STATE.sekolahList.find(s => String(s.npsn).trim() === rowNpsn)
            : STATE.sekolahList.find(s => s.id === defaultSchoolId);
          const sid = targetSchool ? targetSchool.id : defaultSchoolId;

          const kodeRuang = pickCol(r, ['KODE_RUANG', 'RUANG', 'NAMA_RUANG']);
          const namaSesi = pickCol(r, ['NAMA_SESI', 'SESI']);
          const ruang = kodeRuang
            ? STATE.ruang.find(x => x.sekolah_id === sid && (
                String(x.kode_ruang).trim().toLowerCase() === kodeRuang.toLowerCase() ||
                String(x.nama_ruang).trim().toLowerCase() === kodeRuang.toLowerCase()
              ))
            : null;
          const sesi = namaSesi
            ? STATE.sesi.find(x => x.sekolah_id === sid && (
                String(x.nama_sesi).trim().toLowerCase() === namaSesi.toLowerCase() ||
                String(x.nama_sesi).trim().toLowerCase().includes(namaSesi.toLowerCase()) ||
                namaSesi.toLowerCase().includes(String(x.nama_sesi).trim().toLowerCase())
              ))
            : null;

          const username = pickCol(r, ['USERNAME_NISN', 'NISN_USERNAME', 'NISN', 'USERNAME', 'NO_PESERTA', 'NIS']).replace(/\.0$/, '');
          const nama_lengkap = pickCol(r, ['NAMA_LENGKAP', 'NAMA_SISWA', 'NAMA_PESERTA', 'NAMA']);

          if (username && nama_lengkap) {
            dedupMap.set(username, {
              sekolah_id: sid,
              username,
              password: pickCol(r, ['PASSWORD', 'PASS', 'PIN'], '123').replace(/\.0$/, ''),
              nama_lengkap,
              kelas: pickCol(r, ['KELAS', 'ROMBEL'], 'VI'),
              jenis_kelamin: pickCol(r, ['JENIS_KELAMIN', 'JK', 'GENDER'], 'Laki-Laki'),
              tgl_lahir: pickCol(r, ['TGL_LAHIR', 'TANGGAL_LAHIR']),
              ruang_id: ruang ? ruang.id : (STATE.ruang.find(x => x.sekolah_id === sid)?.id || null),
              sesi_id: sesi ? sesi.id : (STATE.sesi.find(x => x.sekolah_id === sid)?.id || null)
            });
          }
        });

        const payloads = Array.from(dedupMap.values());
        if (!payloads.length) {
          return notify("Tidak ada baris valid. Pastikan kolom USERNAME_NISN dan NAMA_LENGKAP terisi.", "error");
        }

        const toInsert = [];
        let updatedCount = 0;
        for (const item of payloads) {
          const existing = STATE.siswaList.find(s => String(s.username).trim() === String(item.username).trim());
          if (existing) {
            await dbUpdate('siswa', existing.id, item);
            updatedCount++;
          } else {
            toInsert.push(item);
          }
        }
        if (toInsert.length > 0) {
          await dbInsert('siswa', toInsert);
        }

        const importedSchoolIds = [...new Set(payloads.map(p => p.sekolah_id).filter(Boolean))];
        if (STATE.activeSekolahId && STATE.activeSekolahId !== 'ALL' && !importedSchoolIds.includes(STATE.activeSekolahId)) {
          STATE.activeSekolahId = importedSchoolIds.length === 1 ? importedSchoolIds[0] : 'ALL';
        }

        await loadRoleScopedData();
        notify(`Berhasil mengimpor ${payloads.length} data siswa (${toInsert.length} baru, ${updatedCount} diperbarui)!`, "success");
      } catch (err) {
        notify("Gagal impor Excel siswa: " + err.message, "error");
      }
    });
  };
  reader.readAsArrayBuffer(file);
}

function handleImportSesiExcel(e) {
  const inputEl = e.target;
  const file = inputEl?.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onerror = () => {
    inputEl.value = '';
    notify("Gagal membaca file Excel sesi ujian.", "error");
  };
  reader.onload = async (evt) => {
    inputEl.value = '';
    await runWithBusyLock('import-sesi-excel', async () => {
      try {
        await ensureXlsxLoaded();
        const rows = parseExcelWorkbook(evt.target.result);
        if (!rows.length) return notify("File Excel sesi ujian kosong.", "error");

        const defaultSchoolId = (STATE.activeSekolahId && STATE.activeSekolahId !== 'ALL')
          ? STATE.activeSekolahId
          : STATE.sekolahList[0]?.id;

        const dedupMap = new Map();
        rows.forEach(r => {
          const rowNpsn = pickCol(r, ['NPSN', 'KODE_NPSN', 'NPSN_SEKOLAH']).replace(/\.0$/, '');
          const targetSchool = rowNpsn
            ? STATE.sekolahList.find(s => String(s.npsn).trim() === rowNpsn)
            : STATE.sekolahList.find(s => s.id === defaultSchoolId);
          const sid = targetSchool ? targetSchool.id : defaultSchoolId;

          const nama_sesi = pickCol(r, ['NAMA_SESI', 'SESI', 'NAMA']);
          const rawMulai = r.WAKTU_MULAI !== undefined && r.WAKTU_MULAI !== '' ? r.WAKTU_MULAI : r.JAM_MULAI;
          const rawSelesai = r.WAKTU_SELESAI !== undefined && r.WAKTU_SELESAI !== '' ? r.WAKTU_SELESAI : r.JAM_SELESAI;
          const waktu_mulai = normalizeExcelTime(rawMulai, '07:30:00');
          const waktu_selesai = normalizeExcelTime(rawSelesai, '09:30:00');

          if (sid && nama_sesi) {
            dedupMap.set(`${sid}::${nama_sesi.toLowerCase()}`, {
              sekolah_id: sid,
              nama_sesi,
              waktu_mulai,
              waktu_selesai
            });
          }
        });

        const parsedItems = Array.from(dedupMap.values());
        if (!parsedItems.length) {
          return notify("Tidak ada baris valid. Pastikan kolom NAMA_SESI terisi.", "error");
        }

        const toInsert = [];
        for (const item of parsedItems) {
          const existing = STATE.sesi.find(
            x => x.sekolah_id === item.sekolah_id && String(x.nama_sesi).trim().toLowerCase() === item.nama_sesi.toLowerCase()
          );
          if (existing) {
            await dbUpdate('sesi_ujian', existing.id, {
              waktu_mulai: item.waktu_mulai,
              waktu_selesai: item.waktu_selesai
            });
          } else {
            toInsert.push(item);
          }
        }

        if (toInsert.length > 0) {
          await dbInsert('sesi_ujian', toInsert);
        }

        await loadRoleScopedData();
        notify(`Berhasil mengimpor ${parsedItems.length} data sesi ujian!`, "success");
      } catch (err) {
        notify("Gagal impor Excel sesi ujian: " + err.message, "error");
      }
    });
  };
  reader.readAsArrayBuffer(file);
}

function handleImportSoalExcel(e) {
  const inputEl = e.target;
  const file = inputEl?.files?.[0];
  if (!file) return;
  if (!STATE.selectedMapelId || STATE.selectedMapelId === 'Semua') {
    inputEl.value = '';
    return notify("Pilih paket ujian terlebih dahulu sebelum mengimpor soal.", "error");
  }
  const reader = new FileReader();
  reader.onerror = () => {
    inputEl.value = '';
    notify("Gagal membaca file Excel soal.", "error");
  };
  reader.onload = async (evt) => {
    inputEl.value = '';
    await runWithBusyLock('import-soal-excel', async () => {
      try {
        await ensureXlsxLoaded();
        const rows = parseExcelWorkbook(evt.target.result);
        if (!rows.length) return notify("File Excel soal kosong.", "error");

        const stimulusCacheByTitle = {};
        STATE.stimulusList.forEach(st => {
          if (st.judul) stimulusCacheByTitle[st.judul.trim().toLowerCase()] = st.id;
        });
        let nextStimUrutan = STATE.stimulusList.length + 1;

        const payloads = [];
        for (let i = 0; i < rows.length; i++) {
          const r = rows[i];
          const jenis = pickCol(r, ['JENIS_SOAL', 'TIPE_SOAL', 'JENIS'], 'PG').toUpperCase();
          const pertanyaan = pickCol(r, ['PERTANYAAN', 'SOAL', 'TEKS_SOAL']);
          if (!pertanyaan) continue;

          const stimJudul = pickCol(r, ['STIMULUS_JUDUL', 'JUDUL_STIMULUS']);
          const stimWacana = pickCol(r, ['STIMULUS_WACANA', 'WACANA_STIMULUS', 'STIMULUS', 'ISI_WACANA']);
          const stimUrl = pickCol(r, ['STIMULUS_GAMBAR_URL', 'GAMBAR_STIMULUS_URL', 'STIMULUS_URL', 'URL_STIMULUS', 'URL_GAMBAR', 'URL']);

          let stimulusId = null;
          if (stimJudul || stimWacana || stimUrl) {
            const lookupTitle = (stimJudul || `Stimulus Soal ${i + 1}`).trim();
            const keyTitle = lookupTitle.toLowerCase();
            if (stimulusCacheByTitle[keyTitle]) {
              stimulusId = stimulusCacheByTitle[keyTitle];
            } else {
              const insertedStim = await dbInsert('stimulus', {
                mapel_id: STATE.selectedMapelId,
                urutan: nextStimUrutan++,
                judul: lookupTitle,
                isi_wacana: stimWacana,
                gambar_url: stimUrl
              });
              if (insertedStim && insertedStim[0]) {
                stimulusId = insertedStim[0].id;
                stimulusCacheByTitle[keyTitle] = stimulusId;
              }
            }
          }

          const rawA = r.OPSI_A !== undefined && r.OPSI_A !== null ? String(r.OPSI_A).trim() : '';
          const rawB = r.OPSI_B !== undefined && r.OPSI_B !== null ? String(r.OPSI_B).trim() : '';
          const rawC = r.OPSI_C !== undefined && r.OPSI_C !== null ? String(r.OPSI_C).trim() : '';
          const rawD = r.OPSI_D !== undefined && r.OPSI_D !== null ? String(r.OPSI_D).trim() : '';
          const rawE = r.OPSI_E !== undefined && r.OPSI_E !== null ? String(r.OPSI_E).trim() : '';

          let opsi = {};
          if (jenis === 'PG' || jenis === 'PGK') {
            if (rawA !== '') opsi.A = rawA;
            if (rawB !== '') opsi.B = rawB;
            if (rawC !== '') opsi.C = rawC;
            if (rawD !== '') opsi.D = rawD;
            if (rawE !== '') opsi.E = rawE;
          } else if (jenis === 'BS') {
            opsi = { pernyataan: rawA.split('|').map(x => x.trim()).filter(Boolean) };
          } else if (jenis === 'MJ') {
            opsi = {
              premis: rawA.split('|').map(x => x.trim()).filter(Boolean),
              target: rawB.split('|').map(x => x.trim()).filter(Boolean)
            };
          } else if (jenis === 'URAIAN') {
            opsi = { pedoman: rawA };
          }

          payloads.push({
            mapel_id: STATE.selectedMapelId,
            stimulus_id: stimulusId,
            nomor_urut: Number(pickCol(r, ['NOMOR', 'NOMOR_URUT', 'NO'], String(i + 1))) || (i + 1),
            jenis_soal: ['PG','PGK','BS','MJ','ISIAN','URAIAN'].includes(jenis) ? jenis : 'PG',
            pertanyaan,
            opsi_jawaban: opsi,
            kunci_jawaban: pickCol(r, ['KUNCI_JAWABAN', 'KUNCI']),
            bobot: Number(pickCol(r, ['BOBOT', 'SKOR'], '1')) || 1
          });
        }

        if (!payloads.length) {
          return notify("Tidak ada baris soal valid. Pastikan kolom PERTANYAAN terisi.", "error");
        }

        await dbInsert('soal', payloads);
        touchMapelCacheVersion(STATE.selectedMapelId);
        await loadBankSoalByMapel(STATE.selectedMapelId);
        STATE.editSoalId = STATE.soalList[0]?.id || null;
        STATE.newSoalNomor = null;
        STATE.formStimulusId = undefined;
        notify(`Berhasil mengimpor ${payloads.length} butir soal beserta stimulus & URL!`, "success");
        render();
      } catch (err) {
        notify("Gagal impor soal Excel: " + err.message, "error");
      }
    });
  };
  reader.readAsArrayBuffer(file);
}

/* ============================================================================
   HELPER FILTER ISOLASI SEKOLAH
   ============================================================================ */
function getEffectiveSchoolFilter() {
  if (STATE.role === 'proktor') return STATE.user.sekolah_id;
  return STATE.activeSekolahId || null;
}

function getScopedSiswaList() {
  const sid = getEffectiveSchoolFilter();
  if (!sid || sid === 'ALL') return STATE.siswaList;
  return STATE.siswaList.filter(s => s.sekolah_id === sid);
}

function getScopedJadwalList() {
  const sid = getEffectiveSchoolFilter();
  if (!sid || sid === 'ALL') return STATE.jadwalList;
  return STATE.jadwalList.filter(j => j.sekolah_id === sid);
}

function getFilteredHasil() {
  const sid = getEffectiveSchoolFilter();
  return STATE.hasilList.filter(h => {
    if (sid && sid !== 'ALL' && h.sekolah_id !== sid) return false;
    if (STATE.selectedMapelId && STATE.selectedMapelId !== 'Semua' && h.mapel_id !== STATE.selectedMapelId) return false;
    if (STATE.selectedKelasFilter && STATE.selectedKelasFilter !== 'Semua') {
      const s = STATE.siswaList.find(x => x.id === h.siswa_id);
      if (!s || s.kelas !== STATE.selectedKelasFilter) return false;
    }
    return true;
  });
}

async function savePengaturanSekolah(e, sekolahId) {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  await runWithBusyLock(`save-sekolah-${sekolahId}`, async () => {
    try {
      const fd = new FormData(e.target);
      const current = getSekolahById(sekolahId);
      const payload = {
        nama_sekolah: (fd.get('nama_sekolah') || current.nama_sekolah || '').trim().toUpperCase(),
        npsn: (fd.get('npsn') || current.npsn || '').trim(),
        kecamatan: (fd.get('kecamatan') ?? current.kecamatan ?? '').trim(),
        logo_url: (fd.get('logo_url') ?? current.logo_url ?? '').trim(),
        app_badge: (fd.get('app_badge') ?? current.app_badge ?? 'PUSDATIN • ANBK').trim() || 'PUSDATIN • ANBK',
        app_subtitle: (fd.get('app_subtitle') ?? current.app_subtitle ?? 'Sistem Asesmen Berbasis Komputer').trim() || 'Sistem Asesmen Berbasis Komputer',
        token_aktif: (fd.get('token_aktif') || current.token_aktif || 'SAS2026').trim().toUpperCase()
      };
      try {
        await dbUpdate('pengaturan_sekolah', sekolahId, payload);
      } catch (dbErr) {
        const msg = String(dbErr?.message || '');
        if (msg.includes('app_badge') || msg.includes('app_subtitle') || msg.includes('schema cache')) {
          const fallbackPayload = { ...payload };
          delete fallbackPayload.app_badge;
          delete fallbackPayload.app_subtitle;
          await dbUpdate('pengaturan_sekolah', sekolahId, fallbackPayload);

async function saveMapel(e) {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  await runWithBusyLock('save-mapel', async () => {
    try {
      const fd = new FormData(e.target);
      const isAllSchools = fd.get('all_schools') === 'on';
      const checkedSchoolIds = [...new Set(fd.getAll('sekolah_ids').map(v => String(v).trim()).filter(Boolean))];
      const selectedSchoolIds = isAllSchools ? [] : checkedSchoolIds;
      const singleSchoolId = selectedSchoolIds.length === 1 ? selectedSchoolIds[0] : null;

      const rawTanggal = fd.get('tanggal_mulai');
      const isoTanggal = parseDMYToISO(rawTanggal);
      if (!isoTanggal) {
        return notify("Format tanggal tidak valid. Gunakan format hari-bulan-tahun (contoh: 25-11-2026).", "error");
      }
      const payload = {
        sekolah_id: singleSchoolId,
        sekolah_ids: selectedSchoolIds,
        kode_mapel: fd.get('kode_mapel').trim().toUpperCase(),
        nama_mapel: fd.get('nama_mapel').trim(),
        kelas_target: fd.get('kelas_target').trim(),
        durasi_menit: Number(fd.get('durasi_menit')) || 60,
        tanggal_mulai: isoTanggal,
        jam_mulai: fd.get('jam_mulai'),
        jam_selesai: fd.get('jam_selesai'),
        acak_soal: fd.get('acak_soal') === 'on',
        acak_opsi: fd.get('acak_opsi') === 'on',
        status: fd.get('status')
      };

      const savePayloadWithFallback = async (isEdit, targetId = null) => {
        try {
          if (isEdit) {
            await dbUpdate('mapel', targetId, payload);
            return targetId;
          } else {
            const inserted = await dbInsert('mapel', payload);
            return inserted?.[0]?.id || null;
          }
        } catch (dbErr) {
          const msg = String(dbErr?.message || '');
          if (msg.includes('sekolah_ids') || msg.includes('schema cache')) {
            const fallbackPayload = { ...payload };
            delete fallbackPayload.sekolah_ids;
            if (isEdit) {
              await dbUpdate('mapel', targetId, fallbackPayload);
              return targetId;
            } else {
              const inserted = await dbInsert('mapel', fallbackPayload);
              return inserted?.[0]?.id || null;
            }
          }
          throw dbErr;
        }
      };

      if (STATE.editMapelId) {
        const savedId = await savePayloadWithFallback(true, STATE.editMapelId);
        if (savedId) {
          try {
            if (selectedSchoolIds.length > 0) localStorage.setItem(`cbt_mapel_schools_${savedId}`, JSON.stringify(selectedSchoolIds));
            else localStorage.removeItem(`cbt_mapel_schools_${savedId}`);
          } catch (_) {}
        }
        touchMapelCacheVersion(STATE.editMapelId);
        STATE.mapelModalOpen = false;
        STATE.editMapelId = null;
        await loadRoleScopedData();
        notify(`Paket ujian "${payload.nama_mapel}" berhasil diperbarui.`, "success");
      } else {
        const createdId = await savePayloadWithFallback(false);
        if (createdId) {
          try {
            if (selectedSchoolIds.length > 0) localStorage.setItem(`cbt_mapel_schools_${createdId}`, JSON.stringify(selectedSchoolIds));
            else localStorage.removeItem(`cbt_mapel_schools_${createdId}`);
          } catch (_) {}
        }
        STATE.mapelModalOpen = false;
        STATE.editMapelId = null;
        if (STATE.adminTab === 'bank_soal' && createdId) {
          STATE.selectedMapelId = createdId;
          STATE.editSoalId = null;
          STATE.newSoalNomor = 1;
          STATE.formStimulusId = undefined;
        }
        await loadRoleScopedData();
        notify(`Paket ujian "${payload.nama_mapel}" berhasil dibuat.`, "success");
      }
    } catch (err) {
      notify("Gagal menyimpan paket ujian: " + err.message, "error");
    }
  }, btn);
}

async function saveSoal(e) {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  await runWithBusyLock('save-soal', async () => {
    try {
      if (!STATE.selectedMapelId || STATE.selectedMapelId === 'Semua') {
        return notify("Pilih paket ujian terlebih dahulu sebelum menyimpan soal.", "error");
      }
      const fd = new FormData(e.target);
      const jenis = fd.get('jenis_soal');
      let opsi = {};
      const kunci = fd.get('kunci_jawaban').trim();

      let pertanyaanHtml = '';
      if (activeQuillPertanyaan) {
        const plainText = activeQuillPertanyaan.getText().trim();
        const hasFormula = activeQuillPertanyaan.root.querySelector('.ql-formula');
        pertanyaanHtml = (plainText || hasFormula) ? activeQuillPertanyaan.root.innerHTML : '';
      } else {
        pertanyaanHtml = (fd.get('pertanyaan') || '').trim();
      }

      if (!pertanyaanHtml) {
        return notify("Teks pertanyaan soal tidak boleh kosong.", "error");
      }

      const rawStimulusId = fd.get('stimulus_id');
      const stimJudul = (fd.get('stimulus_judul') || '').trim();
      const stimWacana = (fd.get('stimulus_isi_wacana') || '').trim();
      const stimImgUrl = (fd.get('stimulus_gambar_url') || '').trim();
      let finalStimulusId = (rawStimulusId && rawStimulusId !== '__NEW__') ? rawStimulusId : null;

      if (finalStimulusId) {
        if (stimJudul || stimWacana || stimImgUrl) {
          await dbUpdate('stimulus', finalStimulusId, {
            judul: stimJudul || 'Stimulus Ujian',
            isi_wacana: stimWacana,
            gambar_url: stimImgUrl
          });
        }
      } else if (stimJudul || stimWacana || stimImgUrl) {
        const insertedStim = await dbInsert('stimulus', {
          mapel_id: STATE.selectedMapelId,
          urutan: STATE.stimulusList.length + 1,
          judul: stimJudul || `Stimulus Soal No. ${Number(fd.get('nomor_urut')) || 1}`,
          isi_wacana: stimWacana,
          gambar_url: stimImgUrl
        });
        if (insertedStim && insertedStim[0]) {
          finalStimulusId = insertedStim[0].id;
        }
      }

      if (jenis === 'PG' || jenis === 'PGK') {
        opsi = {
          A: fd.get('opsi_a').trim(),
          B: fd.get('opsi_b').trim(),
          C: fd.get('opsi_c').trim(),
          D: fd.get('opsi_d').trim()
        };
        if (fd.get('opsi_e')?.trim()) opsi.E = fd.get('opsi_e').trim();
      } else if (jenis === 'BS') {
        opsi = {
          pernyataan: fd.get('bs_pernyataan').split('\n').map(x => x.trim()).filter(Boolean)
        };
      } else if (jenis === 'MJ') {
        opsi = {
          premis: fd.get('mj_premis').split('\n').map(x => x.trim()).filter(Boolean),
          target: fd.get('mj_target').split('\n').map(x => x.trim()).filter(Boolean)
        };
      } else if (jenis === 'URAIAN') {
        opsi = { pedoman: fd.get('pedoman_uraian').trim() };
      }

      const savedNomor = Number(fd.get('nomor_urut')) || (STATE.soalList.length + 1);
      const payload = {
        mapel_id: STATE.selectedMapelId,
        stimulus_id: finalStimulusId,
        nomor_urut: savedNomor,
        jenis_soal: jenis,
        pertanyaan: pertanyaanHtml,
        opsi_jawaban: opsi,
        kunci_jawaban: kunci,
        bobot: Number(fd.get('bobot')) || 1
      };

      if (STATE.editSoalId) {
        await dbUpdate('soal', STATE.editSoalId, payload);
        touchMapelCacheVersion(STATE.selectedMapelId);
        await loadBankSoalByMapel(STATE.selectedMapelId);
        const updated = STATE.soalList.find(q => Number(q.nomor_urut) === savedNomor);
        STATE.editSoalId = updated ? updated.id : STATE.editSoalId;
        STATE.newSoalNomor = null;
        STATE.formStimulusId = undefined;
        notify(`Perubahan Soal No. ${savedNomor} berhasil disimpan.`, "success");
      } else {
        const inserted = await dbInsert('soal', payload);
        touchMapelCacheVersion(STATE.selectedMapelId);
        await loadBankSoalByMapel(STATE.selectedMapelId);
        const created = (inserted && inserted[0])
          ? STATE.soalList.find(q => q.id === inserted[0].id)
          : STATE.soalList.find(q => Number(q.nomor_urut) === savedNomor);
        STATE.editSoalId = created ? created.id : null;
        STATE.newSoalNomor = null;
        STATE.formStimulusId = undefined;
        notify(`Butir Soal No. ${savedNomor} berhasil disimpan.`, "success");
      }
      render();
    } catch (err) {
      notify("Gagal menyimpan soal: " + err.message, "error");
    }
  }, btn);
}

async function generateJadwalMassal(e) {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  await runWithBusyLock('generate-jadwal', async () => {
    try {
      const fd = new FormData(e.target);
      const mapelId = fd.get('mapel_id');
      const sekolahId = fd.get('sekolah_id');
      const kelas = fd.get('kelas');

      const targets = STATE.siswaList.filter(s => {
        if (sekolahId && sekolahId !== 'ALL' && s.sekolah_id !== sekolahId) return false;
        if (kelas && kelas !== 'Semua' && s.kelas !== kelas) return false;
        return true;
      });

      if (!targets.length) return notify("Tidak ada siswa pada sekolah/kelas yang dipilih.", "error");

      const payloads = targets.map(s => ({
        sekolah_id: s.sekolah_id,
        siswa_id: s.id,
        mapel_id: mapelId,
        ruang_id: s.ruang_id,
        sesi_id: s.sesi_id,
        status_ujian: 'Belum Mulai',
        pelanggaran: 0
      }));

      await dbUpsert('jadwal_peserta', payloads, 'siswa_id,mapel_id');
      await loadRoleScopedData();
      notify(`Jadwal berhasil didistribusikan ke ${payloads.length} peserta.`, "success");
    } catch (err) {
      notify("Gagal menerbitkan jadwal: " + err.message, "error");
    }
  }, btn);
}

function proktorResetLogin(jadwalId) {
  const enforceSchool = STATE.role === 'proktor' ? STATE.user.sekolah_id : null;
  const target = STATE.jadwalList.find(j => j.id === jadwalId);
  if (!target) return notify("Data jadwal peserta tidak ditemukan.", "error");
  if (enforceSchool && target.sekolah_id !== enforceSchool) {
    return notify("Akses ditolak: Peserta berasal dari sekolah lain!", "error");
  }
  const siswa = STATE.siswaList.find(s => s.id === target.siswa_id);
  const namaPeserta = siswa ? `${siswa.nama_lengkap} (${siswa.username})` : 'peserta ini';

  askConfirm(
    "Reset Login Peserta",
    `Reset status login untuk ${namaPeserta}? Kunci anti-cheat & hitungan pelanggaran akan di-nol-kan tanpa menghapus jawaban yang sudah tersimpan.`,
    async () => {
      await runWithBusyLock(`reset-login-${jadwalId}`, async () => {

          notify("Gagal melakukan reset login: " + err.message, "error");

function proktorBulkResetLockedLogins(fixedRuangId = null) {
  const enforceSchool = STATE.role === 'proktor' ? STATE.user.sekolah_id : null;
  const lockedRows = getScopedJadwalList().filter(j => {
    if (j.status_ujian !== 'Terkunci') return false;

    if (!fixedRuangId && STATE.selectedRuangFilter !== 'Semua' && j.ruang_id !== STATE.selectedRuangFilter) return false;

  if (!lockedRows.length) {
    return notify("Tidak ada peserta berstatus Terkunci pada filter saat ini.", "info");

    "Reset Login Massal (Peserta Terkunci)",
    `Buka kunci dan reset login untuk ${lockedRows.length} peserta yang berstatus Terkunci? Jawaban peserta tetap aman tersimpan.`,
    async () => {

function proktorResetSesi(jadwalId, siswaId, mapelId) {
